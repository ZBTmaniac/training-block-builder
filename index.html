// WATCH FILES: .fit workouts (Garmin, Coros, Intervals.icu), .zwo (TrainingPeaks, Zwift)
// =====================================================================
const FIT_CRC = [0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401, 0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400];
function fitCrc(bytes, crc = 0){
  for (const b of bytes){
    let t = FIT_CRC[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC[b & 0xF];
    t = FIT_CRC[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC[(b >> 4) & 0xF];
  }
  return crc;
}
// Flatten repeats into FIT steps: children first, then a "repeat from step i, n times" step
function flatSteps(struct){
  const out = [];
  const walk = list => list.forEach(st => {
    if (st.repeat){ const from = out.length; walk(st.steps); out.push({repeatFrom: from, times: st.repeat}); }
    else out.push(st);
  });
  walk(struct);
  return out;
}
function fitWorkout(name, struct){
  const enc = new TextEncoder();
  const bytes = [];
  const u8 = v => bytes.push(v & 0xFF);
  const u16 = v => { u8(v); u8(v >> 8); };
  const u32 = v => { u16(v & 0xFFFF); u16((v >>> 16) & 0xFFFF); };
  const str = (t, size) => { const b = enc.encode(t || ''); for (let i = 0; i < size; i++) u8(i < Math.min(b.length, size - 1) ? b[i] : 0); };
  const ENUM = 0x00, U16 = 0x84, U32 = 0x86, STR = 0x07, U32Z = 0x8C;
  const define = (local, global, fields) => { u8(0x40 | local); u8(0); u8(0); u16(global); u8(fields.length); fields.forEach(([num, size, type]) => { u8(num); u8(size); u8(type); }); };
  // file_id
  define(0, 0, [[0, 1, ENUM], [1, 2, U16], [2, 2, U16], [3, 4, U32Z], [4, 4, U32]]);
  u8(0); u8(5); u16(255); u16(0); u32(Math.floor(Math.random() * 0xFFFFFFF) + 1); u32(Math.floor(Date.now() / 1000) - 631065600);
  const steps = flatSteps(struct);
  // workout
  define(1, 26, [[4, 1, ENUM], [6, 2, U16], [8, 32, STR]]);
  u8(1); u8(1); u16(steps.length); str(name, 32);
  // workout_step
  define(2, 27, [[254, 2, U16], [0, 24, STR], [1, 1, ENUM], [2, 4, U32], [3, 1, ENUM], [4, 4, U32], [5, 4, U32], [6, 4, U32], [7, 1, ENUM]]);
  const INTENSITY = {active:0, rest:1, warmup:2, cooldown:3, recovery:4};
  steps.forEach((st, i) => {
    u8(2); u16(i);
    if (st.repeatFrom !== undefined){
      str('', 24); u8(6); u32(st.repeatFrom); u8(0xFF); u32(st.times); u32(0xFFFFFFFF); u32(0xFFFFFFFF); u8(0xFF);
      return;
    }
    str(st.name, 24);
    if (st.dur.s){ u8(0); u32(st.dur.s * 1000); }           // time, ms
    else if (st.dur.m){ u8(1); u32(st.dur.m * 100); }       // distance, cm
    else { u8(5); u32(0xFFFFFFFF); }                        // open: ends on lap press
    const t = zoneTarget(st.zone);
    if (t && t.pace){ u8(0); u32(0); u32(Math.round(MI_M / t.pace[0] * 1000)); u32(Math.round(MI_M / t.pace[1] * 1000)); }   // speed, mm/s
    else if (t && t.hr){ u8(1); u32(0); u32(t.hr[0] + 100); u32(t.hr[1] + 100); }                                         // custom HR, bpm + 100
    else { u8(2); u32(0xFFFFFFFF); u32(0xFFFFFFFF); u32(0xFFFFFFFF); }                                                     // open
    u8(INTENSITY[st.kind] ?? 0);
  });
  const data = Uint8Array.from(bytes);
  const header = new Uint8Array(14), hv = new DataView(header.buffer);
  header[0] = 14; header[1] = 0x20; hv.setUint16(2, 2132, true); hv.setUint32(4, data.length, true);
  header.set([46, 70, 73, 84], 8);                                                                                       // ".FIT"
  hv.setUint16(12, fitCrc(header.subarray(0, 12)), true);
  const crc = fitCrc(data, fitCrc(header));
  const out = new Uint8Array(14 + data.length + 2);
  out.set(header); out.set(data, 14); out[out.length - 2] = crc & 0xFF; out[out.length - 1] = crc >> 8;
  return out;
}
// .zwo for runs: speeds as a fraction of 5K pace (pace="1"); distances converted to time at the step's pace
function zwoWorkout(name, desc, struct){
  if (!Z) return null;
  const p5 = Z['5K'];
  const frac = zone => zone && Z[zone] ? +(p5 / Z[zone]).toFixed(3) : +(p5 / Z.E).toFixed(3);
  const secs = st => st.dur.s || (st.dur.m ? st.dur.m / MI_M * (st.zone && Z[st.zone] ? Z[st.zone] : Z.E) : 600);
  const one = st => {
    const tag = st.kind === 'warmup' ? 'Warmup' : st.kind === 'cooldown' ? 'Cooldown' : 'SteadyState';
    const pw = frac(st.zone);
    return tag === 'SteadyState' ? `<SteadyState Duration="${Math.round(secs(st))}" Power="${pw}" pace="1"/>`
      : `<${tag} Duration="${Math.round(secs(st))}" PowerLow="${(pw * 0.9).toFixed(3)}" PowerHigh="${pw}" pace="1"/>`;
  };
  const body = struct.map(st => {
    if (st.repeat && st.steps.length === 2 && !st.steps[0].repeat && !st.steps[1].repeat){
      const [a, b] = st.steps;
      return `<IntervalsT Repeat="${st.repeat}" OnDuration="${Math.round(secs(a))}" OffDuration="${Math.round(secs(b))}" OnPower="${frac(a.zone)}" OffPower="${frac(b.zone)}" pace="1"/>`;
    }
    if (st.repeat) return Array.from({length: st.repeat}, () => st.steps.map(one).join('')).join('');
    return one(st);
  }).join('\n    ');
  return `<workout_file>\n  <author>Training Block Builder</author>\n  <name>${xmlEsc(name)}</name>\n  <description>${xmlEsc(desc)}</description>\n  <sportType>run</sportType>\n  <tags/>\n  <workout>\n    ${body}\n  </workout>\n</workout_file>\n`;
}
function watchSessions(fromToday){
  const today = new Date(); today.setHours(0,0,0,0);
  const out = [];
  P.weeks.forEach((W, wi) => W.days.forEach(d => {
    if (!d.struct || (fromToday && d.date < today)) return;
    const name = `W${wi + 1} ${DAYS[(d.date.getDay() + 6) % 7]} ${d.title}`.replace(/[^\w .:+-]/g, '').slice(0, 31);
    out.push({d, wi, name, file: `${iso(d.date)}-${d.title.replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase()}`});
  }));
  return out;
}
function exportWatch(kind){
  const list = watchSessions(true);
  if (!list.length){ alertWatch(P.custom ? 'Uploaded plans don\'t have step-by-step targets, so there are no watch files to make. Calendar and Intervals.icu still work.' : 'No upcoming run workouts to export.'); return; }
  const files = [];
  list.forEach(({d, name, file}) => {
    if (kind === 'fit') files.push({name: file + '.fit', data: fitWorkout(name, d.struct)});
    else { const z = zwoWorkout(name, (d.steps || []).join(' | '), d.struct); if (z) files.push({name: file + '.zwo', data: z}); }
  });
  if (!files.length){ alertWatch('.zwo files need training paces. Add a recent race or time trial on the benchmark screen.'); return; }
  files.push({name: 'README.txt', data: kind === 'fit'
    ? 'Structured run workouts from Training Block Builder.\n\nGarmin: copy the .fit files to the watch\'s GARMIN/NewFiles folder over USB, or import them in Garmin Connect on the web where import is offered.\nIntervals.icu: drag them onto your calendar or into a workout library folder; Intervals.icu can send them to Garmin.\nCoros and others: use the app\'s workout import.\n'
    : 'Structured run workouts from Training Block Builder (Zwift .zwo format).\n\nTrainingPeaks: Workout Library > folder menu > Import Workout (bulk import works).\nZwift: copy the files into Documents/Zwift/Workouts/<your Zwift ID>.\nPaces are relative to your 5K pace in Zwift.\n'});
  download(zipStore(files, 'application/zip'), `${planName()}-${kind === 'fit' ? 'watch' : 'zwo'}-workouts.zip`.replace(/\s+/g, '-'));
}
function alertWatch(t){ const el = $('watchmsg'); if (el){ el.textContent = t; el.hidden = false; } }

// SEND TO INTERVALS.ICU (API key stays on this device; sent only to intervals.icu)
// =====================================================================
const ICU_KEY = 'tbb-icu-v1';
function icuLoad(){ try { return JSON.parse(localStorage.getItem(ICU_KEY)) || {}; } catch(e){ return {}; } }
function icuSave(v){ try { localStorage.setItem(ICU_KEY, JSON.stringify(v)); } catch(e){} }
let ICU = icuLoad();
function b64(bytes){ let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); }
const ICU_TYPE = {Run:'Run', Bike:'Ride', Brick:'Ride', Swim:'Swim', Strength:'WeightTraining', Other:'Workout'};
function icuEvents(weeks){
  // Window starts today, or on the plan's first day if that's later
  const today = new Date(); today.setHours(0,0,0,0);
  const planStart = P.weeks[0].days[0].date;
  const from = planStart > today ? planStart : today;
  const end = addDays(from, weeks * 7);
  const evs = [];
  P.weeks.forEach((W, wi) => W.days.forEach(d => {
    if (d.date < from || d.date >= end) return;
    dayItems(d).forEach((it, i) => {
      if ((it.x && it.x.optional) || it.optional) return;
      const date = iso(d.date) + 'T00:00:00';
      const ev = {category: 'WORKOUT', start_date_local: date, type: ICU_TYPE[it.sport] || 'Run', name: it.title.slice(0, 80),
        description: (it.steps || []).join('\n'), external_id: `tbb-${iso(d.date)}-${i}`};
      if (it.x && it.x.workout) ev.description = [(it.steps || []).join('\n'), it.x.workout].filter(Boolean).join('\n\n');
      if (it.sport === 'Run' && !it.x && d.struct){ ev.filename = 'workout.fit'; ev.file_contents_base64 = b64(fitWorkout(it.title.slice(0, 31), d.struct)); }
      else if (it.x && it.x.mins) ev.moving_time = it.x.mins * 60;
      evs.push(ev);
    });
  }));
  return evs;
}
async function icuCall(path, method, body){
  const r = await fetch('https://intervals.icu/api/v1/athlete/' + encodeURIComponent(ICU.athlete || '0') + path, {
    method, headers: {'Authorization': 'Basic ' + btoa('API_KEY:' + ICU.key), 'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  if (!r.ok){
    const msg = r.status === 401 || r.status === 403 ? 'Intervals.icu rejected the key. Check the API key and athlete ID (Settings → Developer Settings).'
      : r.status === 429 ? 'Intervals.icu says too many requests. Wait a minute and try again.'
      : `Intervals.icu returned an error (${r.status}).`;
    throw new Error(msg);
  }
  return r.json().catch(() => ({}));
}
async function icuSend(){
  const status = t => { $('icustatus').textContent = t; };
  ICU.key = $('icukey').value.trim(); ICU.athlete = $('icuath').value.trim() || '0'; ICU.weeks = +$('icuweeks').value;
  if (!ICU.key){ status('Paste your Intervals.icu API key first.'); return; }
  icuSave(ICU);
  const evs = icuEvents(ICU.weeks);
  if (!evs.length){ status('Nothing to send in that window.'); return; }
  status(`Sending ${evs.length} workouts…`);
  try {
    await icuCall('/events/bulk?upsert=true', 'POST', evs);
    ICU.sent = [...new Set([...(ICU.sent || []), ...evs.map(e => e.external_id)])]; icuSave(ICU);
    status(`Sent ${evs.length} workouts (${iso(new Date(evs[0].start_date_local))} to ${iso(new Date(evs[evs.length - 1].start_date_local))}). If Intervals.icu is linked to Garmin with "Upload planned workouts" on, the next week will reach your watch at the next sync.`);
  } catch (e){
    status(e instanceof TypeError ? 'Couldn\'t reach Intervals.icu from this browser (offline, or the request was blocked). Use the watch files instead and drop them onto your Intervals.icu calendar.' : e.message);
  }
}
async function icuRemove(confirmed){
  const status = t => { $('icustatus').textContent = t; };
  ICU.key = $('icukey').value.trim(); ICU.athlete = $('icuath').value.trim() || '0';
  if (!ICU.key || !(ICU.sent || []).length){ status('Nothing sent from this device to remove.'); return; }
  if (!confirmed){
    $('icustatus').innerHTML = `<b>Remove the ${ICU.sent.length} workouts this app sent to Intervals.icu?</b> Workouts added outside of this app aren't touched. You can send them again anytime.
      <span class="planbtns" style="display:flex;margin-top:8px"><button id="icudelok">Yes, remove them</button><button id="icudelno">Keep them</button></span>`;
    $('icudelok').onclick = () => icuRemove(true); $('icudelno').onclick = () => status('');
    return;
  }
  status('Removing…');
  try {
    await icuCall('/events/bulk-delete', 'PUT', ICU.sent.map(id => ({external_id: id})));
    status(`Removed the ${ICU.sent.length} workouts this app sent.`); ICU.sent = []; icuSave(ICU);
  } catch (e){ status(e instanceof TypeError ? 'Couldn\'t reach Intervals.icu from this browser.' : e.message); }

// GETTING STARTED: run-walk phase for new runners below the plan's base
// =====================================================================
function askCanRun(){
  if (A.expert || !A.distance || !A.experience) return false;
  return A.experience === 'new' || (A.volume !== '' && volMi() < FLOOR[A.distance]);
}
function needsRunWalk(){ return askCanRun() && ['none', 'lt5', '5to15', '15to25'].includes(A.canRun); }
// Levels: [run seconds, walk seconds, repeats]; 0 walk = continuous. Each level is about a week, 3 sessions.
const RW_LEVELS = [
  [60, 90, 8], [90, 120, 6], [120, 90, 6], [180, 90, 5], [300, 120, 4],
  [480, 120, 3], [600, 120, 3], [900, 120, 2], [1500, 0, 1], [1800, 0, 1]

const RW_START = {none: 0, lt5: 0, '5to15': 3, '15to25': 5};
function rwSessionText(L, plain){
  const [run, walk, reps] = L, fmt = x => x % 60 ? `${Math.floor(x / 60) ? Math.floor(x / 60) + ' min ' : ''}${x % 60} s`.trim() : `${x / 60} min`;
  if (!walk) return [`Walk briskly for 5 minutes to warm up`, `Run ${fmt(run)} without stopping, slow enough to talk in full sentences`, `Walk 5 minutes to cool down`];
  return [`Walk briskly for 5 minutes to warm up`, `Run ${fmt(run)}, then walk ${fmt(walk)}. Do that ${reps} times`, `Run slowly enough that you could talk in full sentences. The walks are part of the plan, not a failure.`, `Walk 5 minutes to cool down`];
}
function rwMinutes(L){ return Math.round((L[0] + L[1]) * L[2] / 60 - L[1] / 60 * (L[1] ? 1 : 0) + 10); }
// Build the run-walk weeks; returns {weeks, endIdx, done} where done = reached 30 min continuous
function buildRunWalk(N, raceDate, pad){
  const start = parseDate(A.startDate);
  let seq = [];
  for (let i = RW_START[A.canRun] ?? 0; i < RW_LEVELS.length; i++){
    seq.push(i);
    let guard = 0;
    while ((A.rwRepeats || []).includes(seq.length - 1) && guard++ < 4) seq.push(i);   // "repeat this week" taps
  }
  // Race-date plans short on weeks: keep the first and last level, skip evenly in between
  const maxWeeks = N - 1;                                         // leave the last week for the race or finish run
  while (seq.length > Math.max(1, maxWeeks) && seq.length > 2){ seq.splice(Math.floor(seq.length / 2), 1); }
  while (pad && seq.length < maxWeeks) seq.push(seq[seq.length - 1]);   // extra weeks: hold 30 minutes, three times a week

  const walkDay = +A.days >= 4 ? (L + 1) % 7 : -1;

    const Lv = RW_LEVELS[lv];

    for (let j = 0; j < 7; j++){

      if (runDays.includes(wd)){
        const mins = rwMinutes(Lv);
        days.push({date, role: 'E', kind: 'RW', title: Lv[1] ? `Run-walk: ${Lv[0] >= 60 ? Lv[0] / 60 + ' min' : Lv[0] + ' s'} run, ${Lv[1] >= 60 ? Lv[1] / 60 + ' min' : Lv[1] + ' s'} walk` : `Run ${Lv[0] / 60} minutes`,
          miles: 0, load: mins / 9, sub: `about ${mins} min`, hint: 'Getting started: build up to 30 minutes of running.', steps: rwSessionText(Lv),
          struct: [{kind:'warmup', dur:{s:300}, zone:null, name:'Brisk walk'}, Lv[1] ? {repeat: Lv[2], steps: [{kind:'active', dur:{s:Lv[0]}, zone:null, name:'Run easy'}, {kind:'recovery', dur:{s:Lv[1]}, zone:null, name:'Walk'}]} : {kind:'active', dur:{s:Lv[0]}, zone:null, name:'Run easy'}, {kind:'cooldown', dur:{s:300}, zone:null, name:'Walk'}],

    const mins = days.filter(d => d.kind === 'RW').reduce((t, d) => t + rwMinutes(RW_LEVELS[d.rwLevel]), 0);

// Full plan: run-walk first if needed, then the regular plan for the weeks left
function buildPlanAll(){

  const rest = 0;
  let rw = buildRunWalk(N, raceDate);
  const left = N - rw.weeks.length;
  const minRegular = {'5K': 4, '10K': 5, 'Half': 7, 'Full': 10}[A.distance];
  if (left < minRegular){
    // Run-walk all the way: finish week becomes race (or a 30-minute run)
    const all = buildRunWalk(N, raceDate, true);

    const lastDate = addDays(parseDate(A.startDate), weeks.length * 7);
    if (raceDate || weeks.length < N){

        const date = addDays(lastDate, j);

        days.push(isRace ? {date, role: 'RACE', kind: 'RACE', title: raceDate ? `Race day: ${A.distance}` : A.distance === '5K' ? 'Finish: run your first 5K' : 'Finish: run 30 minutes without stopping', miles: 0, sub: '', hint: 'Use the run-walk rhythm you trained with. Walking is allowed in every race.', steps: ['Warm up with 5 minutes of brisk walking', 'Start slower than feels necessary', 'Use the run-walk timing from your last few weeks if you need it', 'Finish strong, and enjoy it'], struct: [{kind:'warmup', dur:{s:300}, zone:null, name:'Brisk walk'}, {kind:'active', dur:{open:1}, zone:null, name: raceDate ? 'Race' : 'Run (lap to end)'}], lift: null}

      }
      weeks.push({phase: 'runwalk', days, total: 0, sumText: 'Race week'});
    }
    const notes = {rwOnly: true, rwDone: all.done};
    return {weeks: weeks.slice(0, N), notes, N: Math.min(N, weeks.length), pace: easyPace(), rw: true};
  }

  const keep = {startDate: A.startDate, volume: A.volume, weeks: A.weeks, canRun: A.canRun};

  reg.notes.rwThen = {rwWeeks: rw.weeks.length, regWeek: rw.weeks.length + 1};

}

function download(blob, name, noShare){
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch && !noShare && navigator.canShare && window.File){
    const file = new File([blob], name, {type: blob.type || 'application/octet-stream'});

}
const xmlEsc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
function colName(i){ let s = ''; i++; while (i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function sheetXML(rows, widths, dv){
  const body = rows.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => {
    if (v === '' || v === null || v === undefined) return '';
    const ref = colName(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : '';
    if (typeof v === 'number') return `<c r="${ref}"${st}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join('') + '</row>').join('');
  const cols = (widths || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  const dvx = dv && dv.length ? `<dataValidations count="${dv.length}">${dv.map(([ref, list]) => `<dataValidation type="list" allowBlank="1" showErrorMessage="1" errorStyle="warning" errorTitle="Not in the list" error="Pick from the list, or keep your own value and the app will try to read it." sqref="${ref}"><formula1>"${xmlEsc(list.join(','))}"</formula1></dataValidation>`).join('')}</dataValidations>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${body}</sheetData>${dvx}</worksheet>`;
}
// sheets: [{name, rows, widths, dv}]
function xlsxBlob(sheets){
  const files = [
    {name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((sh, i) => `<sheet name="${xmlEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    ...sheets.map((sh, i) => ({name:`xl/worksheets/sheet${i + 1}.xml`, data: sheetXML(sh.rows, sh.widths, sh.dv)}))
  ];
  return zipStore(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
// Export: one row per session, in the upload template's columns (plus Date and Phase), so it can be edited and re-uploaded
function exportXLSX(){
  const unit = A.units;
  const TYPE = {Q:'Quality', T:'Tempo', L:'Long', E:'Easy', R:'Recovery', RACE:'Race', off:'Rest'};
  const INT = {Q:'Hard', T:'Hard', L:'Moderate', RACE:'Hard'};
  const rows = [['Week', 'Day', 'Sport', 'Type', 'Title', 'Details', 'Distance', 'Duration (min)', 'Intensity', 'Date', 'Phase', 'Workout steps']];
  const strength = [['Week', 'Session', 'Exercise', 'Sets × reps', 'Load', 'Notes']];
  P.weeks.forEach((W, wi) => W.days.forEach(d => {
    const day = DAYS[(d.date.getDay() + 6) % 7], phase = PHASE_NAME[W.phase] || '';
    const items = dayItems(d);
    if (!items.length){ rows.push([wi + 1, day, 'Rest', 'Rest', 'Rest', '', '', '', '', iso(d.date), phase]); return; }
    items.forEach((it, k) => {
      const x = it.x;
      if (it.sport === 'Strength'){
        const sess = `Strength ${String.fromCharCode(65 + strength.filter(r => r[0] === wi + 1).map(r => r[1]).filter((v, i, a) => a.indexOf(v) === i).length)}`;
        rows.push([wi + 1, day, 'Strength', '', it.title.startsWith('Strength') && !x ? sess : it.title, 'See the Strength tab', '', x && x.mins ? x.mins : '', x ? x.intensity : 'Moderate', iso(d.date), phase]);
        (it.steps || []).forEach(line => strength.push([wi + 1, it.title.startsWith('Strength') && !x ? sess : it.title, line, '', '', '']));
        return;
      }
      const dist = x ? (x.sport === 'Swim' ? x.swimDist : x.miles ? Math.round((unit === 'km' ? x.miles * KM : x.miles) * 10) / 10 : '')
                     : d.miles ? Math.round((unit === 'km' ? d.miles * KM : d.miles) * 2) / 2 : '';
      const mins = x && x.mins ? x.mins : d.rwLevel !== undefined && !it.optional ? rwMinutes(RW_LEVELS[d.rwLevel]) : '';
      rows.push([wi + 1, day, x ? x.sport : it.sport === 'Other' ? 'Other' : 'Run', x ? x.type : it.optional ? 'Optional' : d.kind === 'RW' ? 'Run-walk' : (TYPE[d.role] || 'Easy'), it.title, (it.steps || []).join(' | '), dist, mins, x ? x.intensity : (INT[d.role] || 'Easy'), iso(d.date), phase, x && x.workout ? x.workout : '']);
    });
  }));
  const dv = [['B2:B2500', DAYS], ['C2:C2500', SPORTS], ['D2:D2500', TYPES], ['I2:I2500', INTENSITIES]];
  download(xlsxBlob([{name:'Plan', rows, widths:[7, 8, 10, 10, 26, 70, 10, 14, 11, 12, 10, 40], dv},
                     ...(strength.length > 1 ? [{name:'Strength', rows: strength, widths:[7, 22, 70, 12, 10, 20]}] : [])]),
    `${planName()}.xlsx`.replace(/\s+/g, '-'));
}

// =====================================================================
// KEEP YOUR PLAN: backups, restore, share link, and update checks.
// Everything stays on the device; backups never include the Intervals.icu API key.
// =====================================================================
const AUTO_KEY = 'tbb-backup-auto';
function backupData(){
  const icu = icuLoad();
  return {app: 'training-block-builder', kind: 'backup', version: APP_VERSION, savedAt: new Date().toISOString(),
    answers: A, icu: {athlete: icu.athlete || '', sent: icu.sent || []}};
}
function saveBackupFile(){
  const stamp = iso(new Date());
  download(new Blob([JSON.stringify(backupData(), null, 1)], {type: 'application/json'}), `training-plan-backup-${stamp}.json`);
  A.lastBackup = stamp; save();
}
function autoBackup(){ try { localStorage.setItem(AUTO_KEY, JSON.stringify(backupData())); } catch(e){} }
function applyBackup(b){
  if (!b || b.app !== 'training-block-builder' || !b.answers || typeof b.answers !== 'object') return 'That file isn\'t a Training Block Builder backup.';
  A = Object.assign({}, DEFAULTS, b.answers); save();
  if (b.icu){ const cur = icuLoad(); icuSave(Object.assign({}, cur, {athlete: cur.athlete || b.icu.athlete || '', sent: [...new Set([...(cur.sent || []), ...(b.icu.sent || [])])]})); ICU = icuLoad(); }
  return '';
}
function pickRestore(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let b; try { b = JSON.parse(await f.text()); } catch(e){ b = null; }
    const err = applyBackup(b);
    if (err){ keepMsg(err); return; }
    if (A.built) showPlan(); else { idx = 0; render(); }
    keepMsg(`Restored your plan from ${b.savedAt ? new Date(b.savedAt).toLocaleDateString() : 'your backup'}.`);
  };
  inp.click();
}
function keepMsg(t){
  const el = $('keepmsg') || $('err'); if (el){ el.hidden = false; el.textContent = t; }
}
// Share link: the plan setup only (race, dates, days, strength). Fitness, goal time, heart rate, check-ins and day changes stay private.
const SHARE_FIELDS = ['distance', 'experience', 'units', 'timeline', 'raceDate', 'weeks', 'startDate', 'days', 'longDay', 'qualityDay', 'strength', 'equipment', 'heat'];
function shareLink(){
  const o = {}; SHARE_FIELDS.forEach(k => { if (A[k] !== undefined && A[k] !== '') o[k] = A[k]; });
  const enc = btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '#setup=' + enc;
}
async function copyShare(){
  const url = shareLink();
  try {
    if (navigator.share && matchMedia('(pointer: coarse)').matches){ await navigator.share({title: 'Training plan setup', url}); return; }
    await navigator.clipboard.writeText(url); keepMsg('Link copied. Whoever opens it gets your plan setup and fills in their own fitness.');
  } catch(e){ if (!e || e.name !== 'AbortError') keepMsg(url); }
}
function readSharedSetup(){
  const m = location.hash.match(/^#setup=([\w-]+)/); if (!m) return null;
  try {
    const b = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const o = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
    const out = {}; SHARE_FIELDS.forEach(k => { if (o[k] !== undefined) out[k] = o[k]; });
    return out;
  } catch(e){ return null; }
}
function openSharedSetup(o, confirmed){
  if (A.built && !confirmed){
    $('plan').hidden = true; $('tabbar').hidden = true; $('quiz').hidden = false; $('quizbar').hidden = true;
    $('step').textContent = ''; $('progress').innerHTML = '';
    $('screen').innerHTML = `<h1>Open a shared plan setup?</h1>
      <p class="lead">Someone sent you a ${esc(o.distance || '')} plan setup. Opening it replaces the plan on this device. Your current plan is backed up here first, and you can save a backup file too.</p>
      <div class="planbtns"><button id="shareok">Open the shared setup</button><button id="shareno">Keep my plan</button></div>
      <div class="planbtns" style="margin-top:8px"><button id="sharebk">Save a backup file first</button></div>`;
    $('shareok').onclick = () => openSharedSetup(o, true);
    $('shareno').onclick = () => { history.replaceState(null, '', location.pathname); showPlan(); };
    $('sharebk').onclick = saveBackupFile;
    return;
  }
  history.replaceState(null, '', location.pathname);
  if (A.built){ autoBackup(); }   // keep the current plan recoverable
  A = Object.assign({}, DEFAULTS, o, {built: false}); save();
  $('plan').hidden = true; $('tabbar').hidden = true; $('quiz').hidden = false; $('quizbar').hidden = false;
  idx = 0; render();
  $('err').textContent = 'Someone shared a plan setup with you. Check each answer and add your own fitness details.' + (localStorage.getItem(AUTO_KEY) ? ' Your previous plan was backed up on this device.' : '');
}
function standalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function keepCard(){
  return `<div class="card"><h3>Keep your plan safe</h3>
    <p class="sub">Your plan lives only in this browser. Save a backup now and then, especially before switching phones.</p>
    <div class="planbtns" style="margin-top:8px"><button id="kbackup">Save a backup</button><button id="krestore">Restore a backup</button></div>
    ${P && !P.custom ? `<div class="planbtns" style="margin-top:8px"><button id="kshare">Share this plan setup</button></div>
      <p class="quiet" style="margin:6px 0 0">Sends a link with your race, dates, days, and strength choices. Your fitness, goal time, heart rate, and check-ins stay private.</p>` : ''}
    ${!standalone() ? `<p class="flag" style="margin-top:10px"><b>Tip:</b> add this app to your Home Screen. Browsers can clear a website's saved data after a while without a visit; Home Screen apps keep it.</p>` : ''}
    <p class="quiet" style="margin:8px 0 0">${A.lastBackup ? `Last backup: ${fmtDayShort(A.lastBackup)}.` : 'No backup saved yet.'} Backups don't include your Intervals.icu API key.</p>
    <p id="keepmsg" class="flag" role="status" hidden></p></div>`;
}
// Update check: compare the running version with the published one; back up first, then refresh
let updateShown = false;
async function checkForUpdate(){
  if (updateShown || !navigator.onLine) return;
  try {
    const res = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) showUpdateBar(m[1]);
  } catch(e){}
}
function showUpdateBar(v){
  updateShown = true;
  const bar = document.createElement('div'); bar.className = 'updatebar'; bar.setAttribute('role', 'status');
  bar.innerHTML = `<span><b>A new version is ready</b> (${esc(v)}). Your plan is backed up on this device first, then the app refreshes.</span><button type="button">Update now</button>`;
  bar.querySelector('button').onclick = () => { autoBackup(); location.reload(); };
  document.body.appendChild(bar);
}
// After an update: if the saved plan didn't survive, put the automatic backup back
(function recoverAfterUpdate(){
  try {
    const raw = localStorage.getItem(KEY), auto = JSON.parse(localStorage.getItem(AUTO_KEY) || 'null');
    let ok = true; try { ok = !!JSON.parse(raw); } catch(e){ ok = false; }
    if ((!raw || !ok) && auto && auto.answers && auto.answers.built){ applyBackup(auto); }
  } catch(e){}
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
document.addEventListener('click', e => {
  if (e.target.id === 'kbackup') saveBackupFile();
  else if (e.target.id === 'krestore') pickRestore();
  else if (e.target.id === 'kshare') copyShare();
});
// Ask the browser to keep this site's data (helps on browsers that clear unused sites)
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

function applyPalette(){ document.documentElement.dataset.palette = A.palette === 'cb' ? 'cb' : 'std'; }
applyPalette();
document.addEventListener('click', e => { const b = e.target.closest('button[data-palette]'); if (!b) return; A.palette = b.dataset.palette; save(); applyPalette(); drawPlan(); });
const SHARED = readSharedSetup();
if (SHARED) openSharedSetup(SHARED); else if (A.built) showPlan(); else render();
setTimeout(checkForUpdate, 4000);

if ('serviceWorker' in navigator) {
  // When a new version takes over, offer it (the banner backs up first)
  const hadController = !!navigator.serviceWorker.controller;   // first visit: nothing to refresh
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; checkForUpdate(); } });   // offer the update instead of reloading mid-use
  window.addEventListener('load', () => navigator.serviceWorker.register("bb-sw.js").catch(() => {}));
}
</script>
