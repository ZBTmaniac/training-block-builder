<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Block Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Training Block Builder</title>
<link rel="manifest" href="bb-manifest.json">
<link rel="apple-touch-icon" href="bb-icon-180.png">
<link rel="icon" type="image/png" href="bb-icon-512.png">
<meta name="theme-color" content="#1E2422">
<style>
:root{
  --bg:#E9ECE6; --surface:#F6F7F3; --ink:#1E2422; --muted:#5E6762; --line:#CBD1CA;
  --run:#2F55A4; --bike:#1F7A68; --lift:#B4721A; --rest:#9AA39E;
  --display:"Avenir Next Condensed","DIN Condensed","Arial Narrow",sans-serif;
  --body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151A1D; --surface:#1E2529; --ink:#E4E8E3; --muted:#9AA49F; --line:#313A3F;
    --run:#86A3E6; --bike:#5CC0A8; --lift:#E0A44E; --rest:#5E6762;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--run);outline-offset:2px}

.step{font-size:14px;color:var(--muted);margin:4px 0 0}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.5px;margin:6px 0 6px}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.progress{display:flex;gap:5px;margin:10px 0 0}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--run)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:17px}
.card .sub{margin:0 0 10px;font-size:14px;color:var(--muted)}

.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(56px,1fr))}
.choice{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer}
.choices.row .choice{text-align:center;padding:12px 4px}
.choice b{display:block;font-weight:600}
.choice span{display:block;font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border:2px solid var(--run);padding:11px 13px;background:var(--surface)}
.choices.row .choice[aria-pressed="true"]{padding:11px 3px}

label.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
label.field:last-child{border-bottom:none}
label.field input,label.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:150px;min-width:0}
.time{display:flex;gap:4px;align-items:center}
.time input{width:52px!important;text-align:center;padding:8px 4px!important}

.flag{border-left:3px solid var(--lift);padding:2px 0 2px 12px;margin:12px 0 0;font-size:14px}
.flag b{color:var(--lift)}
.err{color:#B3261E;font-size:14px;margin:10px 0 0;min-height:1em}
@media (prefers-color-scheme: dark){.err{color:#F2B8B5}}

.review{width:100%;border-collapse:collapse;font-size:15px}
.review td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.review td:first-child{color:var(--muted);width:42%}
.review td:last-child{text-align:right}
.review button{border:none;background:none;color:var(--run);cursor:pointer;padding:0 0 0 8px;font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.bar button{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.bar button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar button[hidden]{display:none}
.bar button:disabled{opacity:.4;cursor:default}
.quiet{font-size:13px;color:var(--muted)}

/* ---------- plan view ---------- */
.phase{font-size:14px;color:var(--muted);margin:4px 0 0}
.weekrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.weekno{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,64px);white-space:nowrap;line-height:.9;letter-spacing:-1px;margin:4px 0 0}
.weekno small{font-size:28px;color:var(--muted);font-weight:600;letter-spacing:0}
.dates{font-size:15px;color:var(--muted);margin:6px 0 0}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.nav button:disabled{opacity:.35}
.weeknote{margin:12px 0 0;font-size:15px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px}
.strip a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:12px}
.strip a.is-today{color:var(--ink);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px}
.bar-run{width:7px;border-radius:2px;background:var(--run)}
.bar-run.race{background:var(--lift)}
.bar-lift{width:7px;height:10px;border-radius:2px;background:var(--lift)}
.bar-rest{background:var(--rest);height:4px;width:4px;border-radius:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 14px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend .l-run::before{background:var(--run)} .legend .l-lift::before{background:var(--lift)}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
details.day.is-today{border:2px solid var(--ink)}
details.day summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px}
details.day summary::-webkit-details-marker{display:none}
.dnum{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center}
.dn{font-weight:600}
.sumline{font-size:14px;color:var(--muted)}
.dots{margin-left:auto;display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.run{background:var(--run)} .dot.lift{background:var(--lift)}
.daybody{padding:0 14px 14px}
.item{border-left:3px solid var(--rest);padding:2px 0 2px 12px;margin:12px 0}
.item.run{border-color:var(--run)} .item.lift{border-color:var(--lift)}
.item h3{font-size:16px;margin:0 0 2px}
.item p{margin:0;font-size:15px}
.notes summary{cursor:pointer;font-weight:600;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary::after{content:" ▾";color:var(--muted)}
.planbtns{display:flex;gap:10px;margin:18px 0 0}
.planbtns button{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.overview{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.overview td{padding:6px 0;border-bottom:1px solid var(--line)}
.overview td:last-child{text-align:right}
.overview tr.cur td{font-weight:700}
.steps{margin:8px 0 0;padding-left:18px;font-size:15px}
.steps li{margin:3px 0}
.goal{border-left:4px solid var(--bike)}
.goal.goal-amb{border-left-color:var(--lift)}
.goal.goal-big{border-left-color:#B3261E}
.overview button{border:none;background:none;color:var(--run);cursor:pointer;font:inherit;padding:0}
</style>
</head>
<body>
<main>
  <section id="quiz">
    <p class="step" id="step"></p>
    <div class="progress" id="progress"></div>
    <div id="screen"></div>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section id="plan" hidden></section>
</main>
<nav class="bar" id="quizbar"><div>
  <button id="back">Back</button>
  <button id="next" class="primary">Next</button>
</div></nav>

<script>
// ---------- state ----------
const KEY = 'tbb-answers-v1';
const DEFAULTS = {
  distance:null, experience:null, units:'mi', volume:'',
  timeline:'race', raceDate:'', weeks:12, startDate:nextMonday(),
  benchKind:'race', benchDist:'5K', benchTime:{h:'',m:'',s:''}, goalTime:{h:'',m:'',s:''},
  days:null, longDay:'Sat', qualityDay:'Tue',
  strength:null, equipment:null,
  expert:false, ackTough:false
};
let A = load();
let idx = 0;

function load(){
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch(e){ return Object.assign({}, DEFAULTS); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(A)); } catch(e){} }

// ---------- helpers ----------
function nextMonday(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  return iso(d);
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function weeksBetween(a,b){ return Math.floor((parseDate(b) - parseDate(a)) / (7*864e5)); }
function secs(t){ const h=+t.h||0, m=+t.m||0, s=+t.s||0; return h*3600+m*60+s; }
function fmtTime(t){ const x=secs(t); if(!x) return '—'; const h=Math.floor(x/3600), m=Math.floor(x%3600/60), s=x%60;
  return (h? h+':'+String(m).padStart(2,'0') : m)+':'+String(s).padStart(2,'0'); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function choices(name, opts, cls=''){
  return `<div class="choices ${cls}">` + opts.map(o =>
    `<button type="button" class="choice" data-name="${name}" data-val="${esc(o.v)}" aria-pressed="${String(A[name])===String(o.v)}">
       <b>${esc(o.label)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ''}</button>`).join('') + '</div>';
}
function timeInputs(name){
  const t = A[name];
  return `<span class="time">
    <input inputmode="numeric" maxlength="2" placeholder="h" data-time="${name}" data-part="h" value="${esc(t.h)}" aria-label="hours">:
    <input inputmode="numeric" maxlength="2" placeholder="mm" data-time="${name}" data-part="m" value="${esc(t.m)}" aria-label="minutes">:
    <input inputmode="numeric" maxlength="2" placeholder="ss" data-time="${name}" data-part="s" value="${esc(t.s)}" aria-label="seconds"></span>`;
}
function daySelect(name){
  return `<select data-field="${name}">` + DAYS.map(d => `<option ${A[name]===d?'selected':''}>${d}</option>`).join('') + '</select>';
}

// ---------- screens ----------
const SCREENS = [
  {
    title:'What are you training for?',
    lead:'Pick your goal distance. You can build another plan any time.',
    render: () => choices('distance', [
      {v:'5K', label:'5K', sub:'3.1 mi'}, {v:'10K', label:'10K', sub:'6.2 mi'},
      {v:'Half', label:'Half marathon', sub:'13.1 mi'}, {v:'Full', label:'Marathon', sub:'26.2 mi'}
    ], 'two'),
    check: () => A.distance ? '' : 'Pick a distance to continue.'
  },
  {
    title:'Where are you starting?',
    lead:'This sets your starting volume. Plans build from where you are now, not where you want to be.',
    render: () => `
      <div class="card"><h3>Running experience</h3>
      ${choices('experience', [
        {v:'new', label:'New to running', sub:'Little or no regular running yet'},
        {v:'some', label:"I've trained before", sub:'Done a plan or a few races'},
        {v:'regular', label:'I train regularly', sub:'Structured training most of the year'}
      ])}</div>
      <div class="card"><h3>Recent weekly volume</h3>
      <p class="sub">Your average over the last 4 weeks. 0 is fine.</p>
      <label class="field">Per week <input type="number" inputmode="decimal" min="0" data-field="volume" value="${esc(A.volume)}" placeholder="e.g. 15"></label>
      <div style="margin-top:10px">${choices('units', [{v:'mi',label:'Miles'},{v:'km',label:'Kilometers'}], 'two')}</div>
      </div>`,
    check: () => {
      if (!A.experience) return 'Pick your experience level.';
      if (A.volume === '' || isNaN(+A.volume) || +A.volume < 0) return 'Enter your recent weekly volume (0 is fine).';
      if (!A.expert && +A.volume > (A.units==='mi'?150:240)) return 'That volume looks too high. Check the units.';
      return '';
    }
  },
  {
    title:'When is it?',
    lead:'Training for a race? Use its date. Otherwise pick a plan length.',
    render: () => `
      <div class="card">${choices('timeline', [{v:'race',label:'Race date'},{v:'length',label:'Plan length'}], 'two')}
      <div style="margin-top:8px">
        <label class="field">Start date <input type="date" data-field="startDate" value="${esc(A.startDate)}"></label>
        ${A.timeline==='race'
          ? `<label class="field">Race date <input type="date" data-field="raceDate" value="${esc(A.raceDate)}"></label>`
          : `<label class="field">Weeks <select data-field="weeks">${[6,8,10,12,14,16,18,20].map(w=>`<option ${+A.weeks===w?'selected':''}>${w}</option>`).join('')}</select></label>`}
      </div>${timelineNote()}</div>`,
    check: () => {
      if (!A.startDate) return 'Pick a start date.';
      if (A.timeline==='race'){
        if (!A.raceDate) return 'Pick your race date.';
        const w = weeksBetween(A.startDate, A.raceDate);
        if (A.expert && w < 0) return 'The race date needs to be after your start date.';
        if (!A.expert && w < 3) return 'The race needs to be at least 3 weeks after your start date.';
        if (!A.expert && w > 30) return 'That race is over 30 weeks out. Start later, or pick a plan length for now.';
      }
      return '';
    }
  },
  {
    title:'How fast are you now?',
    lead:'A recent result sets your training paces. No recent race? Use a time you think you could run today, and the plan will check it with a time trial in week 3 or 4.',
    render: () => `
      <div class="card"><h3>Your benchmark</h3>
      ${choices('benchKind', [{v:'race',label:'Recent result',sub:'Race or time trial'},{v:'aspire',label:'Best guess',sub:'Labeled aspirational'},{v:'none',label:'Skip',sub:'Train by feel'}])}
      ${A.benchKind!=='none' ? `<div style="margin-top:8px">
        <label class="field">Distance <select data-field="benchDist">${['1 mile','5K','10K','Half','Full'].map(d=>`<option ${A.benchDist===d?'selected':''}>${d}</option>`).join('')}</select></label>
        <label class="field">Time ${timeInputs('benchTime')}</label></div>` : ''}
      </div>
      <div class="card"><h3>Goal time <span class="quiet">(optional)</span></h3>
      <p class="sub">We'll tell you how it compares with where your fitness is likely to be on race day.</p>
      <label class="field">${esc(A.distance||'Race')} goal ${timeInputs('goalTime')}</label></div>`,
    check: () => {
      for (const n of ['benchTime','goalTime']) {
        const t = A[n];
        if ([t.m,t.s].some(v => v!=='' && (isNaN(+v) || +v>59)) || (t.h!=='' && isNaN(+t.h))) return 'Times use hours, minutes (0–59) and seconds (0–59).';
      }
      if (A.benchKind!=='none' && !secs(A.benchTime)) return 'Enter your benchmark time, or choose Skip.';
      return '';
    }
  },
  {
    title:'How many days a week?',
    lead:'Count running days only. We recommend 4 to 6.',
    render: () => `
      <div class="card">${choices('days', (A.expert ? [1,2,3,4,5,6,7] : [3,4,5,6]).map(n => ({v:n, label:String(n)})), 'row')}
      ${+A.days===3 ? `<p class="flag"><b>Heads up:</b> on 3 days, the long run carries a big share of the week, which is hard on bones and tendons. A 4th short, easy run helps a lot. You can still go with 3.</p>` : ''}
      </div>
      <div class="card"><h3>Your week</h3>
      <label class="field">Long run day ${daySelect('longDay')}</label>
      <label class="field">Hard workout day ${daySelect('qualityDay')}</label>
      <p class="quiet" style="margin:8px 0 0">Your hard workout can be on a track, road or treadmill.</p></div>`,
    check: () => {
      if (!A.days) return 'Pick how many days you can run.';
      if (A.expert) return '';
      if (A.longDay === A.qualityDay) return 'Put your long run and hard workout on different days.';
      const gap = Math.abs(DAYS.indexOf(A.longDay) - DAYS.indexOf(A.qualityDay));
      if (Math.min(gap, 7-gap) < 2) return 'Leave at least one day between your long run and hard workout.';
      return '';
    }
  },
  {
    title:'Strength training',
    lead:'Lifting protects joints, tendons and bones, holds your form late in races, and builds the power that makes you faster. Any amount helps.',
    render: () => `
      <div class="card"><h3>Days per week</h3>
      ${choices('strength', [{v:0,label:'None'},{v:1,label:'1'},{v:2,label:'2'},{v:3,label:'3'}], 'row')}</div>
      ${+A.strength>0 || A.strength===null ? `<div class="card"><h3>What equipment do you have?</h3>
      ${choices('equipment', [
        {v:'bw', label:'Bodyweight', sub:'No equipment, or a backpack you can load'},
        {v:'db', label:'Dumbbells or kettlebells', sub:'At home or at the gym'},
        {v:'bb', label:'Barbell or full gym', sub:'Rack, bar and plates'}
      ])}</div>` : ''}
      ${strengthNote()}`,
    check: () => {
      if (A.strength === null) return 'Pick how many strength days you want, or None.';
      if (+A.strength > 0 && !A.equipment) return 'Pick the equipment you have.';
      return '';
    }
  },
  {
    title:'Review',
    lead:'Check your answers. Tap Edit to change one.',
    render: () => `<div class="card"><table class="review">${reviewRows().map(([k,v,i]) =>
      `<tr><td>${k}</td><td>${esc(v)}<button type="button" data-goto="${i}">Edit</button></td></tr>`).join('')}</table></div>
      ${expertCard()}
      <p class="quiet">Your answers and plan are saved on this device only.</p>`,
    check: () => ''
  }
];

let expertAsk = false;
function expertCard(){
  if (A.expert) return `<div class="card"><h3>Expert mode is on</h3>
    <p class="sub">Volume, distance and time safety checks are off. The plan builds whatever you ask for.</p>
    <button type="button" class="choice" data-expert="off"><b>Turn expert mode off</b></button></div>`;
  if (expertAsk) return `<div class="card"><h3>Are you sure?</h3>
    <p class="sub">This removes volume, distance and time safety checks. The plan will build whatever you ask for, even if it makes no sense.</p>
    <div class="choices two"><button type="button" class="choice" data-expert="cancel"><b>Cancel</b></button>
    <button type="button" class="choice" data-expert="on"><b>Yes, turn it on</b></button></div></div>`;
  return `<div class="card"><h3>Experienced runner?</h3>
    <p class="sub">Turn off the caps on long runs, single runs and weekly volume. Off by default.</p>
    <button type="button" class="choice" data-expert="ask"><b>I know what I'm doing</b></button></div>`;
}
function timelineNote(){
  if (A.timeline!=='race' || !A.raceDate || !A.startDate) return '';
  const w = weeksBetween(A.startDate, A.raceDate);
  return w >= 3 ? `<p class="quiet" style="margin:10px 0 0">That's a ${w}-week plan.</p>` : '';
}
function strengthNote(){
  if (A.strength === null) return '';
  if (+A.strength === 0) return `<p class="flag"><b>Worth reconsidering:</b> runners who lift get hurt less and hold their form better late in races. Even one session a week helps. Your choice stands.</p>`;
  if (A.equipment === 'bw') return `<p class="flag"><b>Good start.</b> Bodyweight work still needs to get hard to keep helping. The plan uses single-leg moves and a loaded backpack so it can.</p>`;
  return '';
}
function reviewRows(){
  const exp = {new:'New to running', some:"I've trained before", regular:'I train regularly'}[A.experience];
  const eq = {bw:'Bodyweight', db:'Dumbbells / kettlebells', bb:'Barbell / gym'}[A.equipment];
  const when = A.timeline==='race' ? `Race ${A.raceDate} (${weeksBetween(A.startDate,A.raceDate)} wks)` : `${A.weeks} weeks`;
  const bench = A.benchKind==='none' ? 'Skipped' : `${A.benchDist} ${fmtTime(A.benchTime)}${A.benchKind==='aspire'?' (aspirational)':''}`;
  return [
    ['Goal', A.distance, 0],
    ['Experience', exp, 1],
    ['Weekly volume', `${A.volume} ${A.units}`, 1],
    ['Timeline', when, 2],
    ['Start', A.startDate, 2],
    ['Benchmark', bench, 3],
    ['Goal time', fmtTime(A.goalTime), 3],
    ['Run days', `${A.days} per week`, 4],
    ['Long run / hard day', `${A.longDay} / ${A.qualityDay}`, 4],
    ['Strength', +A.strength ? `${A.strength}× per week, ${eq}` : 'None', 5]
  ];
}

// ---------- render + events ----------
const $ = id => document.getElementById(id);
function render(){
  const s = SCREENS[idx];
  $('step').textContent = `Step ${idx+1} of ${SCREENS.length}`;
  $('progress').innerHTML = SCREENS.map((_,i) => `<i class="${i<=idx?'on':''}"></i>`).join('');
  $('screen').innerHTML = `<h1>${s.title}</h1><p class="lead">${s.lead}</p>` + s.render();
  $('err').textContent = '';
  $('back').hidden = idx === 0;
  $('next').textContent = idx === SCREENS.length-1 ? 'Build my plan' : 'Next';
}
function rerender(){ // keep scroll + focus-friendly redraw within a screen
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

$('screen').addEventListener('click', e => {
  const x = e.target.closest('[data-expert]');
  if (x){
    const v = x.dataset.expert;
    if (v === 'ask') expertAsk = true;
    if (v === 'cancel') expertAsk = false;
    if (v === 'on'){ A.expert = true; expertAsk = false; }
    if (v === 'off'){ A.expert = false; if (+A.days < 3 || +A.days > 6) A.days = null; }
    A.ackTough = false; save(); rerender(); return;
  }
  if (ackMode){ ackClick(e); return; }
  const c = e.target.closest('.choice');
  if (c){
    const name = c.dataset.name; let v = c.dataset.val;
    if (['days','strength'].includes(name)) v = +v;
    A[name] = v;
    if (name==='strength' && v===0) A.equipment = null;
    A.ackTough = false; save(); rerender(); return;
  }
  const g = e.target.closest('[data-goto]');
  if (g){ idx = +g.dataset.goto; render(); window.scrollTo(0,0); }
});
$('screen').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field){ A[t.dataset.field] = t.value; A.ackTough = false; save(); }
  if (t.id === 'ackbox'){ $('next').disabled = !t.checked; return; }
  if (t.dataset.time){ t.value = t.value.replace(/\D/g,''); A[t.dataset.time] = Object.assign({}, A[t.dataset.time], {[t.dataset.part]: t.value}); save(); }
  $('err').textContent = '';
});
$('screen').addEventListener('change', e => {
  // redraw for fields that change what the screen shows
  if (['raceDate','startDate','benchDist'].includes(e.target.dataset.field)) rerender();
});

$('next').addEventListener('click', () => {
  const msg = SCREENS[idx].check();
  if (msg){ $('err').textContent = msg; return; }
  if (idx < SCREENS.length-1){ idx++; render(); window.scrollTo(0,0); }
  else {
    if (ackMode){
      if (!$('ackbox') || !$('ackbox').checked){ $('err').textContent = 'Check the box to go ahead, or pick one of the options.'; return; }
      A.ackTough = true; ackMode = false; $('next').disabled = false; A.built = true; save(); showPlan(); return;
    }
    for (let i = 0; i < SCREENS.length; i++){ const m = SCREENS[i].check(); if (m){ idx = i; render(); $('err').textContent = m; return; } }
    if (needsAck()){ showAck(); return; }
    A.built = true; save(); showPlan();
  }
});
$('back').addEventListener('click', () => {
  if (ackMode){ ackMode = false; $('next').disabled = false; render(); window.scrollTo(0,0); return; }
  if (idx > 0){ idx--; render(); window.scrollTo(0,0); }
});

// ---------- "know what you're signing up for" (marathon, slower or short timeline) ----------
let ackMode = false;
function toughNotes(){
  if (A.expert || A.distance !== 'Full') return null;
  const t = buildPlan().notes;
  return (t.timeLimited || t.outkick || t.compressed) ? t : null;
}
function needsAck(){ return !A.ackTough && !!toughNotes(); }
function showAck(){
  const t = toughNotes(); ackMode = true;
  const lines = [];
  if (t.timeLimited) lines.push(`At your easy pace, ${A.days} run days fit about ${fmtDist(t.timeLimited.fit)} a week within the safety caps. Marathon plans like this usually peak around ${fmtDist(t.timeLimited.target)}.`);
  if (t.outkick) lines.push(`Your timeline is too short to build safely to the usual peak. The plan tops out near ${fmtDist(t.outkick.peak)}.`);
  else if (t.compressed) lines.push('Your timeline is short, so volume steps up every 2 weeks with no cutback weeks.');
  lines.push('Lower training volume makes the last miles of a marathon much harder. That can mean a lot of walking.');
  $('step').textContent = 'Before we build';
  $('screen').innerHTML = `<h1>Know what you're signing up for</h1>
    <p class="lead">You can absolutely do this. It's a tough build, so here are the tradeoffs.</p>
    <div class="card"><ul style="margin:0;padding-left:20px">${lines.map(l => `<li style="margin:6px 0;font-size:15px">${esc(l)}</li>`).join('')}</ul></div>
    <div class="card"><h3>Ways to make it easier</h3>
      <div class="choices">
        <button type="button" class="choice" data-ack="later"><b>Pick a later race or longer plan</b><span>More weeks to build volume safely</span></button>
        ${+A.days < 6 ? `<button type="button" class="choice" data-ack="day"><b>Add a run day (${+A.days + 1} days)</b><span>More room in each week</span></button>` : ''}
      </div></div>
    <div class="card"><label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer">
      <input type="checkbox" id="ackbox" style="width:22px;height:22px;margin-top:1px;flex:none">
      <span>I understand this volume may not be enough to run the whole marathon comfortably, and I want to go ahead.</span></label></div>`;
  $('err').textContent = '';
  $('back').hidden = false;
  $('next').textContent = 'Build my plan'; $('next').disabled = true;
  window.scrollTo(0, 0);
}
function ackClick(e){
  const b = e.target.closest('[data-ack]');
  if (!b) return;
  ackMode = false; $('next').disabled = false;
  if (b.dataset.ack === 'later'){ idx = 2; render(); window.scrollTo(0,0); }
  if (b.dataset.ack === 'day'){ A.days = +A.days + 1; save(); if (needsAck()) showAck(); else { A.built = true; save(); showPlan(); } }
}

// =====================================================================
// PLAN ENGINE (v0.2 skeleton). Rules come from the Rules Spec doc.
// Everything is computed in miles; converted for display.
// =====================================================================
const KM = 1.609344;
const LEVEL = {new:'new', some:'some', regular:'regular'};
// Peak weekly volume bands (mi) by distance and experience
const BANDS = {
  '5K':  {new:[10,15], some:[20,30], regular:[30,45]},
  '10K': {new:[12,18], some:[22,32], regular:[32,50]},
  'Half':{new:[20,25], some:[25,35], regular:[35,50]},
  'Full':{new:[35,45], some:[40,55], regular:[55,65]}
};
// Minimum starting volume a plan needs (mi/week)
const FLOOR = {'5K':6, '10K':8, 'Half':8, 'Full':10};
// Long run share of the week by run days
const LONG_SHARE = {1:1, 2:0.6, 3:0.40, 4:0.33, 5:0.30, 6:0.27, 7:0.25};
// Long run the plan builds toward by the peak phase (mi), before time/distance caps
const LR_PEAK = {
  '5K':{new:5, some:7, regular:9}, '10K':{new:6, some:8, regular:10},
  'Half':{new:10, some:12, regular:13}, 'Full':{new:16, some:18, regular:20}
};
const DIST_MI = {'1 mile':1, '5K':3.107, '10K':6.214, 'Half':13.109, 'Full':26.219};
const PHASE_NAME = {base:'Base', build:'Build', peak:'Peak', taper:'Taper'};
const PHASE_NOTE = {
  base:'Building the engine. Mostly easy running, with short fast strides and hills to stay sharp.',
  build:'Quality work ramps up. Hard days are hard, easy days stay truly easy.',
  peak:'Race-specific work. The biggest weeks of the plan.',
  taper:'Less volume, same sharpness. Trust the training.'
};

function volMi(){ const v = +A.volume || 0; return A.units === 'km' ? v / KM : v; }
function fmtDist(mi){ const v = A.units === 'km' ? mi * KM : mi; return (Math.round(v * 2) / 2).toString().replace(/\.0$/, '') + ' ' + A.units; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const r5 = x => Math.round(x * 2) / 2;

// Easy pace (min/mi) from the benchmark, or a default by experience
function easyPace(){
  if (A.benchKind !== 'none' && secs(A.benchTime)){
    const d = DIST_MI[A.benchDist];
    const t5k = secs(A.benchTime) * Math.pow(3.107 / d, 1.06);   // Riegel to a 5K equivalent
    return Math.min(14, Math.max(7, (t5k / 60 / 3.107) * 1.32)); // easy ≈ 5K pace + ~30%
  }
  return {new:12, some:10.5, regular:9.25}[A.experience];
}

function planWeeks(){
  if (A.timeline === 'race'){
    const days = Math.round((parseDate(A.raceDate) - parseDate(A.startDate)) / 864e5);
    return Math.floor(days / 7) + 1;
  }
  return +A.weeks;
}

// Base -> build -> peak -> taper. Base grows with the gap between start and target volume.
function phaseList(N, gap){
  const D = A.distance;
  const taper = Math.min(N, D === 'Full' ? (N >= 16 ? 3 : 2) : D === 'Half' ? (N >= 10 ? 2 : 1) : 1);
  let peak = (D === 'Full' || D === 'Half') ? 3 : 2;
  if (N < 8) peak = Math.max(1, peak - 1);
  peak = Math.max(0, Math.min(peak, N - taper));
  const rest = Math.max(0, N - taper - peak);
  let base = rest < 2 ? rest : Math.min(rest - 1, Math.max(1, Math.round(rest * (0.4 + 0.3 * gap))));
  const build = rest - base;
  return [...Array(base).fill('base'), ...Array(build).fill('build'), ...Array(peak).fill('peak'), ...Array(taper).fill('taper')];
}

// Step-up ramp: hold a level, then step. Normal = 3 weeks + a cutback week; compressed = 2-week holds.
function rampVolumes(start, target, rampWeeks, notes){
  if (rampWeeks <= 0 || target <= start) return {levels: Array(rampWeeks).fill(start), cut: Array(rampWeeks).fill(false), peak: Math.max(start, target)};
  const tryMode = h => { const B = Math.ceil(rampWeeks / h); return {h, B, r: Math.pow(target / start, 1 / B)}; };
  let m = tryMode(4), mode = 'normal';
  if (m.r - 1 > 0.15){ m = tryMode(2); mode = 'compressed'; }
  let peak = target;
  if (!A.expert && m.r - 1 > 0.20){ m.r = 1.20; peak = start * Math.pow(1.2, m.B); mode = 'compressed'; notes.outkick = {peak, target}; }
  if (mode === 'compressed') notes.compressed = true;
  const levels = [], cut = [];
  for (let w = 0; w < rampWeeks; w++){
    const block = Math.floor(w / m.h), inBlock = w % m.h;
    let v = start * Math.pow(m.r, block);
    const c = mode === 'normal' && inBlock === 3;            // cutback week
    if (c) v *= 0.8;
    levels.push(v); cut.push(c);
  }
  return {levels, cut, peak};
}

// Which weekday (0=Mon..6=Sun) gets which role
function weekLayout(){
  const n = +A.days, L = DAYS.indexOf(A.longDay), Q = DAYS.indexOf(A.qualityDay);
  const roles = Array(7).fill('off');
  roles[L] = 'L';
  if (n === 1) return roles;
  const Qd = Q === L ? (L + 3) % 7 : Q;
  roles[Qd] = 'Q';
  if (n === 2) return roles;
  const dist = (a, b) => { const g = Math.abs(a - b); return Math.min(g, 7 - g); };
  // Tempo: as far from both the long run and the quality day as possible, prefer after the quality day
  let best = -1, bestScore = -1;
  for (let d = 0; d < 7; d++){
    if (roles[d] !== 'off') continue;
    const score = Math.min(dist(d, L), dist(d, Qd)) * 10 + ((d - Qd + 7) % 7 < (Qd - d + 7) % 7 ? 1 : 0);
    if (score > bestScore){ bestScore = score; best = d; }
  }
  roles[best] = 'T';
  // Extra easy days: recovery after the long run, then around the quality day; never the day before the long run unless needed
  const T = best;
  const pref = [(L + 1) % 7, (Qd + 1) % 7, (Qd + 6) % 7, (T + 1) % 7, (T + 6) % 7, 0,1,2,3,4,5,6, (L + 6) % 7];
  let extra = n - 3;
  for (const d of pref){
    if (extra <= 0) break;
    if (roles[d] !== 'off' || (d === (L + 6) % 7 && pref.indexOf(d) < pref.length - 1)) continue;
    roles[d] = (d === (L + 1) % 7 && n >= 5) ? 'R' : 'E'; extra--;
  }
  for (let d = 0; extra > 0 && d < 7; d++) if (roles[d] === 'off'){ roles[d] = 'E'; extra--; }
  return roles;
}

// ---------- paces and effort ----------
function benchT5k(){
  if (A.benchKind === 'none' || !secs(A.benchTime)) return null;
  return secs(A.benchTime) * Math.pow(3.107 / DIST_MI[A.benchDist], 1.06);
}
// Training paces in sec/mile, from a 5K-equivalent of the benchmark
function paceZones(){
  const t5 = benchT5k(); if (!t5) return null;
  const p5 = t5 / 3.107;
  const z = {E:p5 * 1.32, steady:p5 * 1.2, MP:p5 * 1.15, HM:p5 * 1.09, T:p5 * 1.075, '10K':p5 * 1.042, '5K':p5, R:p5 * 0.94};
  const g = secs(A.goalTime);
  z.race = g ? g / DIST_MI[A.distance] : {'5K':z['5K'], '10K':z['10K'], 'Half':z.HM, 'Full':z.MP}[A.distance];
  return z;
}
const ZONE_LABEL = {E:'easy', steady:'steady', MP:'marathon pace', HM:'half-marathon pace', T:'threshold', '10K':'10K pace', '5K':'5K pace', R:'mile pace', race:'goal race pace'};
const ZONE_RPE = {E:'2–3', steady:'5', MP:'5–6', HM:'6–7', T:'7', '10K':'8', '5K':'8–9', R:'9'};
function fmtPace(sPerMi){
  const s = Math.round(A.units === 'km' ? sPerMi / KM : sPerMi);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '/' + A.units;
}
let Z = null;   // set per plan build
function at(key){
  const rpe = key === 'race' ? {'5K':'8–9', '10K':'8', 'Half':'6–7', 'Full':'5–6'}[A.distance] : ZONE_RPE[key];
  const label = key === 'race' && Z && Z.raceProj ? 'projected race pace' : ZONE_LABEL[key];
  return Z ? `at ${label} (${fmtPace(Z[key])}, RPE ${rpe})` : `at ${label} (RPE ${rpe})`;
}

// ---------- workouts ----------
function workoutSteps(d, phase, f, k, pace){
  const D = A.distance, lvl = A.experience, short = D === '5K' || D === '10K';
  const n = (lo, hi) => Math.round(lo + (hi - lo) * f);
  // Keep the main set to ~60% of the day's distance so warm-up and cool-down fit
  const fit = (reps, repMi) => Math.max(2, Math.min(reps, Math.floor(0.6 * d.miles / repMi)));
  const fitMin = (reps, min) => fit(reps, min / (pace * 0.8));
  const WU = 'Warm up: 10–15 min easy, then 4 strides';
  const CD = "Cool down: easy running to finish the day's distance";
  const long = d.miles * pace > 75;
  const fuel = 'Practice fueling: carbs every 30–45 min';
  switch (d.kind){
    case 'E': return ['Easy the whole way ' + at('E')].concat(d.strides ? ['Finish with 6 × 20 s strides: quick and relaxed, full recovery between'] : []);
    case 'R': return ['Slower than easy. Skip it if you feel beat up.'];
    case 'MLR': return ['Easy the whole way ' + at('E')].concat(long ? [fuel] : []);
    case 'SH': return ['15–20 min very easy', '4 × 20 s strides'];
    case 'TT': return [WU, `Run ${D === 'Full' ? 'a hard 10K' : D === 'Half' ? 'a hard 10K' : 'your ' + D} as a time trial, or at goal effort`, 'Cool down: 10 min easy'];
    case 'RACE': return ['Start a touch slower than goal pace for the first mile', 'Settle in ' + at('race')].concat(D === 'Full' || D === 'Half' ? ['Fuel the way you practiced: carbs every 30–45 min'] : ['Hold back for the first half, then race the second']);
    case 'Q': {
      if (phase === 'base'){
        if (lvl === 'new') return ['Easy ' + at('E'), 'Finish with 4–6 × 20 s strides'];
        return k % 2 ? [WU, `${n(6, 10)} × 30 s hill sprints, hard but controlled; walk down to recover`, CD]
                     : [WU, `Fartlek: ${n(6, 10)} × 1 min ${at('10K')}, 1 min easy between`, CD];
      }
      if (phase === 'taper') return [WU, short ? `${n(4, 6)} × 400 m ${at('race')}, full recovery` : `3 × 1 km ${at('race')}, 2 min jog`, CD];
      if (lvl === 'new') return [WU, `Fartlek: ${n(5, 8)} × 1–2 min comfortably hard (RPE 7), 2 min easy between`, CD];
      if (phase === 'peak' && D === '5K') return [WU, `${fit(n(8, 12), 0.25)} × 400 m ${at('race')}, 200 m jog`, CD];
      if (phase === 'peak' && D === '10K') return [WU, `${fit(n(4, 6), 0.62)} × 1 km ${at('race')}, 400 m jog`, CD];
      const ff = phase === 'peak' ? 1 : f;
      const m = (lo, hi) => Math.round(lo + (hi - lo) * ff);
      if (short) return [WU, lvl === 'regular' ? `${fit(m(5, 6), 0.62)} × 1 km ${at('5K')}, 2–3 min jog` : `${fit(m(5, 6), 0.5)} × 800 m ${at('5K')}, equal-time jog`, CD];
      return [WU, lvl === 'regular' ? `${fit(m(4, 6), 1)} × 1600 m ${at('10K')}, 2–3 min jog` : `${fit(m(6, 8), 0.5)} × 800 m ${at('10K')}, 400 m jog`, CD];
    }
    case 'T': {
      if (phase === 'taper') return ['Easy ' + at('E'), 'Finish with 4–6 × 20 s strides'];
      if (phase === 'base'){
        if (lvl === 'new') return ['Easy the whole way ' + at('E')];
        return ['Easy for the first half ' + at('E'), `Then ${n(15, 25)} min ${at('steady')}`, 'Easy to finish'];
      }
      if (phase === 'peak'){
        if (short) return [WU, lvl === 'new' ? `${n(2, 3)} × 5 min ${at('T')}, 2 min easy jog` : `Cruise intervals: ${fit(n(4, 5), 1)} × 1600 m ${at('T')}, 1 min rest`, CD];
        if (D === 'Half') return [WU, lvl === 'new' ? `2 × ${fmtDist(1.5)} ${at('race')}, 3 min easy` : `${fit(n(2, 3), 2.5)} × ${fmtDist(2)} ${at('race')}, 800 m float at steady pace`, CD];
        return ['Easy ' + at('E'), `Last ${n(15, 20)} min ${at('steady')}`, 'Kept light on purpose: the long run carries goal-pace work this phase'];
      }
      if (lvl === 'new') return [WU, `${n(2, 3)} × 5 min ${at('T')}, 2 min easy jog`, CD];
      if (lvl === 'some') return [WU, `Float set: ${fitMin(n(3, 4), 8)} × 6 min ${at('T')}, 2 min float at steady pace (keep moving, no full stops)`, CD];
      return [WU, `Float set: ${fitMin(n(3, 5), 10)} × 8 min ${at('T')}, 2 min float at steady pace (keep moving, no full stops)`, CD];
    }
    case 'L': {
      if (phase === 'taper') return ['Easy and relaxed ' + at('E'), 'Shorter on purpose. Arrive at the start line fresh.'];
      const base = ['Easy the whole way ' + at('E'), 'Even effort beats even pace on hills'];
      const rehearse = 'Dress rehearsal: race-morning breakfast, race kit and shoes, race-day fueling';
      if (phase !== 'peak') return base.concat(long ? [fuel] : []);
      if (D === 'Full'){
        const mp = lvl === 'new' ? `Last ${fmtDist(3)} ${at('race')}` : lvl === 'some' ? `2 × ${fmtDist(3)} ${at('race')}, ${fmtDist(1)} easy between` : `Middle ${fmtDist(n(8, 12))} ${at('race')}`;
        return (d.rehearsal ? [rehearse] : []).concat(['Easy ' + at('E') + ' to start', mp, 'Easy to finish', fuel]);
      }
      if (D === 'Half' && lvl !== 'new') return (d.rehearsal ? [rehearse] : []).concat(['Easy ' + at('E'), `Last ${fmtDist(n(2, 3))} ${at('race')}`]).concat(long ? [fuel] : []);
      return (d.rehearsal && !short ? [rehearse] : []).concat(base).concat(long ? [fuel] : []);
    }
  }
  return [];
}

    load: 'add about 5 lb (2 kg) to the pack, or slow the lowering'
  }
};
function liftSteps(t, phase, f, cut){
  const L = LIFTS[A.equipment] ? LIFTS[A.equipment] : LIFTS.bw;
  const eq = A.equipment || 'bw';
  const acc = f >= 0.5 && !cut ? 3 : 2;                                  // accessory sets grow through each phase
  const rx = eq === 'bw'
    ? (phase === 'base' ? `${acc} × ${f < 0.5 ? 10 : 12}/leg` : `${acc} × 6–8/leg, add weight to the pack`)
    : (phase === 'base' ? `${cut ? 2 : 3} × ${f < 0.5 ? 8 : 6} at RPE ${cut ? 6 : 7}` : cut ? '2 × 3–5 at RPE 7' : '3 × 3–5 at RPE 8, heavy with clean reps');
  const line = ([name, pre, swap]) => `${name.replace('{acc}', acc)}: ${pre.replace('{rx}', rx).replace('{acc}', acc)}${swap ? ` · Swap: ${swap}` : ''}`;
  const out = [];
  if (cut) out.push('Cutback week: lighter on purpose. Sets are already reduced; keep effort around RPE 6–7 and drop a set from any jumps.');
  if (t.includes('maintenance')){
    out.push(line(L.maint), line(L.heavy[0]), line(L.heavy[2]), 'Skip the jumps in the last 10 days before your race');
    return out;
  }
  if (t.includes('heavy')){
    out.push(line(L.main), ...L.heavy.map(line));
    if (!cut) out.push(`Progress: when every set of the main lift feels easier than its target RPE, ${L.load}.`);
    return out;
  }
  if (t.includes('power')) return out.concat(L.power.map(line), ['Quality over quantity: stop a set when the jumps slow down.']);
  return out.concat(L.moderate.map(line));
}

// ---------- goal check ----------
function goalCheck(N){
  const t5 = benchT5k(), g = secs(A.goalTime);
  if (!t5 || !g) return null;
  const proj = t5 * Math.pow(DIST_MI[A.distance] / 3.107, 1.06);
  const r = {new:[0.05, 0.10], some:[0.03, 0.06], regular:[0.01, 0.03]}[A.experience];
  const sc = Math.min(1, N / 12);
  const fast = proj * (1 - r[1] * sc), slow = proj * (1 - r[0] * sc);
  const tier = g >= fast ? 'on' : g >= fast * 0.95 ? 'amb' : 'big';
  return {fast, slow, goal: g, tier};
}
function fmtSecs(x){
  x = Math.round(x); const h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60), s = x % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

function sessionTitle(role, phase, week, ctx){
  const D = A.distance, lvl = A.experience, short = (D === '5K' || D === '10K');
  if (role === 'Q'){
    if (phase === 'base') return lvl === 'new' ? 'Easy + strides' : 'Hills or fartlek';
    if (phase === 'build') return lvl === 'new' ? 'Fartlek' : short ? 'VO2 intervals' : 'Intervals';
    if (phase === 'peak') return lvl === 'new' ? 'Fartlek' : short ? 'Race-pace reps' : 'Intervals';
    return 'Race-pace touches';
  }
  if (role === 'T'){
    if (phase === 'base') return lvl === 'new' ? 'Easy run' : 'Steady run';
    if (phase === 'build') return lvl === 'new' ? 'Tempo (short)' : 'Tempo (float sets)';
    if (phase === 'peak') return short ? (lvl === 'new' ? 'Tempo (short)' : 'Threshold (cruise intervals)') : D === 'Half' ? 'Half-marathon pace' : 'Steady run';
    return 'Easy + strides';
  }
  if (role === 'L'){
    if (phase === 'peak' && D === 'Full') return ctx.rehearsal ? 'Long run: dress rehearsal' : 'Long run with goal-pace miles';
    if (phase === 'peak' && D === 'Half' && lvl !== 'new') return ctx.rehearsal ? 'Long run: dress rehearsal' : 'Long run, fast finish';
    if (phase === 'peak' && ctx.rehearsal && !short) return 'Long run: dress rehearsal';
    return phase === 'taper' ? 'Long run (shorter)' : 'Long run';
  }
  if (role === 'E') return ctx.strides ? 'Easy + strides' : 'Easy run';
  if (role === 'R') return 'Recovery run';
  return 'Rest';
}
const HINT = {
  Q:'Your hard day. Very hard efforts with very easy recoveries.',
  T:'Comfortably hard. Float sets keep you working near threshold without full stops.',
  L:'Conversational the whole way. It is hard because of the distance, not the pace.',
  E:'Truly easy. You should be able to hold a conversation.',
  R:'Slower than easy. Just loosen up after the long run.',
  RACE:'Race day. Start controlled, finish strong.',
  TT:'Run your goal distance or a hard time trial to see where your fitness is.',
  MLR:'Easy pace, longer than your other weekday runs. It carries endurance work the long run can\'t.',
  SH:'Short and easy, with a few strides to wake the legs up.',
  off:'Rest, walk, or easy cross-training.'
};

function buildPlan(){
  const notes = {};
  const N = planWeeks();
  const D = A.distance, lvl = A.experience, n = +A.days;
  const pace = easyPace();
  Z = paceZones();
  const gc0 = goalCheck(planWeeks());
  if (Z && gc0 && gc0.tier === 'big'){ Z.race = gc0.fast / DIST_MI[D]; Z.raceProj = true; }
  const band = BANDS[D][lvl];
  const recent = volMi();
  const start = A.expert ? Math.max(recent, 1) : Math.max(recent, FLOOR[D]);
  if (start > recent + 0.5) notes.floor = start;
  let target = start >= band[1] ? start * 1.05 : Math.min(band[1], Math.max(band[0], start * 1.25));
  // Time-aware ceiling: what fits in the week without breaking the long-run and single-run caps
  const tCap = (D === '5K' || D === '10K') ? {new:60, some:75, regular:90}[lvl] : 150;
  const lrCap0 = Math.min(tCap / pace, D === 'Full' ? (lvl === 'regular' ? 22 : 20) : D === 'Half' ? 15 : 13);
  const fits = k => 0.95 * (lrCap0 + (k - 1) * (70 / pace)
    - (k >= 5 ? (70 - 45) / pace : 0) + (k >= 5 ? Math.max(0, Math.min(0.7 * lrCap0, 90 / pace) - 70 / pace) : 0));
  if (!A.expert && target > fits(n) + 1){
    notes.timeLimited = {target, fit: fits(n), next: n < 6 ? Math.min(target, fits(n + 1)) : null, overStart: start > fits(n)};
    target = Math.max(start, fits(n));
  }
  const gap = Math.max(0, Math.min(1, (target - start) / target));
  const phases = phaseList(N, gap);
  const rampWeeks = phases.filter(p => p === 'base' || p === 'build').length;
  const ramp = rampVolumes(start, target, rampWeeks, notes);
  const peakVol = rampWeeks ? ramp.peak : Math.max(start, Math.min(target, start * 1.1));
  const taperMult = {3:[0.8,0.65,0.45], 2:[0.75,0.5], 1:[0.6]}[phases.filter(p => p === 'taper').length];
  const layout = weekLayout();
  const startDate = parseDate(A.startDate);
  const raceDate = A.timeline === 'race' ? parseDate(A.raceDate) : null;
  const timeCap = A.expert ? Infinity : (D === '5K' || D === '10K') ? {new:60, some:75, regular:90}[lvl] : 150;
  const distCap = A.expert ? Infinity : D === 'Full' ? (lvl === 'regular' ? 22 : 20) : D === 'Half' ? 15 : 13;
  const minRun = 25 / pace, minRec = 20 / pace;
  const capMiAll = Math.min(timeCap / pace, distCap);
  const peakIdx = phases.map((p, i) => p === 'peak' ? i : -1).filter(i => i >= 0);
  const rehearsals = new Set(peakIdx.slice(0, 2));
  // Marathon: slower runners with a long enough plan may take the dress-rehearsal long runs
  // to 3 hours or 16 mi. Every other long run stays under ~2.5 hours.
  const extCap = Math.min(180 / pace, 16);
  const extOK = !A.expert && D === 'Full' && extCap > capMiAll + 0.5 && N >= 16 && start * LONG_SHARE[n] >= 6;
  if (!A.expert && D === 'Full' && extCap > capMiAll + 0.5 && !extOK) notes.shortForExt = true;
  // Caps for runs other than the long run
  const runCap = A.expert ? Infinity : 70 / pace, recCap = A.expert ? Infinity : 45 / pace, mlrCap = 90 / pace;
  const circ = (a, b) => { const g = Math.abs(a - b); return Math.min(g, 7 - g); };
  const RW = {Q:1.15, T:1.15, E:1, R:0.7};
  // Split the non-long-run volume across the week. Single runs are capped; on 5-6 days the
  // overflow goes to one midweek medium-long run; anything left is reported as a shortfall.
  function allocate(rest, longMi){
    const idxs = [0,1,2,3,4,5,6].filter(d => RW[layout[d]]);
    const sum = idxs.reduce((t, d) => t + RW[layout[d]], 0) || 1;
    const out = {}; let over = 0, mlr = -1;
    idxs.forEach(d => {
      const r = layout[d];
      let m = Math.max(r === 'R' ? minRec : minRun, rest * RW[r] / sum);
      const cap = r === 'R' ? recCap : runCap;
      if (m > cap){ over += m - cap; m = cap; }
      out[d] = m;
    });
    if (over > 0.25 && n >= 5){
      const L = layout.indexOf('L');
      const eDays = idxs.filter(d => layout[d] === 'E').sort((a, b) => circ(b, L) - circ(a, L));
      if (eDays.length){
        mlr = eDays[0];
        const add = Math.min(over, Math.max(0, Math.min(0.7 * longMi, mlrCap) - out[mlr]));
        out[mlr] += add; over -= add;
      }
    }
    return {out, over, mlr};
  }
  const strengthN = +A.strength || 0;

  let ti = 0, bestLR = 0;
  const weeks = phases.map((phase, w) => {
    let vol = phase === 'taper' ? peakVol * taperMult[ti++] : phase === 'peak' ? peakVol : ramp.levels[w];
    const isLast = w === N - 1;
    // Long run: the larger of its share of the week and a steady build toward the peak long run,
    // never more than ~55% of the week, then capped by time and distance.
    const startLR = start * LONG_SHARE[n];
    const peakLR = Math.max(startLR, LR_PEAK[D][lvl]);
    let longMi;
    if (phase === 'taper') longMi = bestLR * taperMult[ti - 1];
    else {
      const f = phase === 'peak' ? 1 : (rampWeeks ? (w + 1) / (rampWeeks + 1) : 1);
      longMi = Math.max(vol * LONG_SHARE[n], startLR + (peakLR - startLR) * f);
      if (ramp.cut[w]) longMi *= 0.8;
      const ext = extOK && rehearsals.has(w);
      if (ext) longMi = Math.max(longMi, extCap);
      longMi = Math.min(longMi, vol * (A.expert ? 1 : 0.55));
      const capThis = ext ? extCap : capMiAll;
      if (longMi > capThis){ longMi = capThis; if (!(D === '5K' || D === '10K')) notes.capped = true; }
      if (ext && longMi > capMiAll + 0.5) notes.extended = Math.max(notes.extended || 0, longMi);
      if (longMi / vol > 0.4) notes.share = true;
      bestLR = Math.max(bestLR, longMi);
    }
    const rest = Math.max(0, vol - longMi);
    const al = allocate(rest, longMi);
    if (phase !== 'taper' && al.over > Math.max(2, 0.1 * vol)) notes.addDay = Math.max(notes.addDay || 0, al.over);
    let stridesGiven = false;
    const days = [];
    for (let j = 0; j < 7; j++){
      const date = addDays(startDate, w * 7 + j);
      const wd = (date.getDay() + 6) % 7;
      let role = layout[wd];
      let miles = 0;
      if (role === 'L') miles = longMi;
      else if (RW[role]) miles = al.out[wd];
      const isMLR = wd === al.mlr && miles > runCap + 0.5;
      let ctx = {rehearsal: rehearsals.has(w)};
      if (role === 'E' && !isMLR && !stridesGiven && phase !== 'taper' && !(phase === 'base' && lvl === 'new')){ ctx.strides = true; stridesGiven = true; }
      let title = sessionTitle(role, phase, w, ctx), hintKey = role;
      if (isMLR){ title = 'Medium-long run'; hintKey = 'MLR'; }
      // Race week handling
      if (raceDate && isLast){
        const daysToRace = Math.round((raceDate - date) / 864e5);
        if (daysToRace === 0){ role = 'RACE'; title = A.distance === 'Full' ? 'Race day: marathon' : A.distance === 'Half' ? 'Race day: half marathon' : 'Race day: ' + A.distance; miles = DIST_MI[A.distance]; hintKey = 'RACE'; }
        else if (daysToRace < 0){ role = 'off'; title = 'Recover'; miles = 0; hintKey = 'off'; }
        else if (daysToRace === 1){ role = 'off'; title = 'Rest'; miles = 0; hintKey = 'off'; }
        else if (daysToRace === 2 && role !== 'off'){ role = 'E'; title = 'Shakeout + strides'; miles = minRec; hintKey = 'SH'; }
        else if (role === 'L'){ role = 'E'; title = 'Easy run'; miles = minRun; hintKey = 'E'; }
      } else if (!raceDate && isLast && role === 'L'){
        title = 'Time trial or goal effort'; hintKey = 'TT'; miles = Math.max(DIST_MI[A.distance] + 2, minRun);
      }
      days.push({date, role, title, miles: miles ? r5(miles) : 0, hint: HINT[hintKey] || '', lift: null, kind: hintKey, strides: !!ctx.strides, rehearsal: role === 'L' && !!ctx.rehearsal});
    }
    // Strength: on hard days first, never the day before the long run or on the long run
    let sCount = phase === 'peak' ? Math.min(1, strengthN) : phase === 'taper' ? (isLast ? 0 : Math.min(1, strengthN)) : strengthN;
    const dayBeforeLong = days.findIndex((d, i) => days[(i + 1) % 7] && days[i + 1] && days[i + 1].role === 'L');
    const order = [...days.keys()].sort((a, b) => {
      const rank = r => ({Q:0, T:1, E:2, off:3, R:4}[r] ?? 9);
      return rank(days[a].role) - rank(days[b].role);
    });
    const used = [];
    for (const i of order){
      if (sCount <= 0) break;
      const d = days[i];
      if (['L','RACE'].includes(d.role) || i === dayBeforeLong) continue;
      if (used.some(u => Math.abs(u - i) < 2)) continue;   // keep heavy sessions 48h apart
      d.lift = used.length === 0 ? (phase === 'peak' || phase === 'taper' ? 'Strength: maintenance' : 'Strength: heavy day') : used.length === 1 ? 'Strength: moderate day' : 'Strength: power day';
      used.push(i); sCount--;
    }
    const total = days.reduce((s, d) => s + (d.role === 'RACE' ? 0 : d.miles), 0);
    return {phase, days, total, cut: !!(ramp.cut && ramp.cut[w])};
  });
  // Fill in workouts: progress (0..1) through each phase drives rep counts
  const pCount = {}, pSeen = {};
  phases.forEach(p => pCount[p] = (pCount[p] || 0) + 1);
  weeks.forEach(W => {
    const k = pSeen[W.phase] = (pSeen[W.phase] || 0) + 1;
    const f = pCount[W.phase] > 1 ? (k - 1) / (pCount[W.phase] - 1) : 1;
    W.days.forEach(d => {
      d.steps = workoutSteps(d, W.phase, f, k, pace);
      if (d.lift) d.liftSteps = liftSteps(d.lift, W.phase, f, W.cut);
    });
  });
  return {weeks, notes, N, pace, target, peakVol, start, goal: goalCheck(N)};
}

// ---------- plan view ----------
let P = null, wk = 0;
function showPlan(){
  P = buildPlan();
  $('quiz').hidden = true; $('quizbar').hidden = true; $('plan').hidden = false;
  const today = new Date(); today.setHours(0,0,0,0);
  const off = Math.floor((today - parseDate(A.startDate)) / (7 * 864e5));
  wk = Math.min(Math.max(off, 0), P.N - 1);
  drawPlan(); window.scrollTo(0, 0);
}
function showQuiz(){
  $('plan').hidden = true; $('quiz').hidden = false; $('quizbar').hidden = false;
  idx = SCREENS.length - 1; render(); window.scrollTo(0, 0);
}
function noteList(){
  const N = P.notes, out = [];
  if (A.expert) return ['Expert mode is on: volume, distance and time safety checks are off.', 'Not medical advice. Listen to your body and adjust.'];
  if (+A.days === 3) out.push('On 3 run days, the long run is a big share of your week. A 4th short, easy run would make the plan easier on your body.');
  if (N.floor) out.push(`Week 1 starts at about ${fmtDist(N.floor)}, a bit above your recent volume, because this plan needs a minimum base.`);
  if (N.outkick) out.push(`Your timeline can't safely reach this plan's usual peak of ${fmtDist(N.outkick.target)}. It tops out near ${fmtDist(N.outkick.peak)}. A later race or shorter distance would help, or treat this as a finish-focused plan.`);
  else if (N.compressed) out.push('Short timeline: volume steps up every 2 weeks with no cutback weeks. Back off if you feel run down.');
  if (N.extended) out.push(`Your two dress-rehearsal long runs build to about 3 hours (${fmtDist(N.extended)}). Every other long run stays under about 2.5 hours, which is where injury risk starts to climb.`);
  else if (N.shortForExt && N.capped) out.push(`Long runs are capped at about 2.5 hours (around ${fmtDist(150 / P.pace)} at your easy pace). Building safely to 3 hours takes a plan of 16+ weeks and a starting long run of about 6 miles.`);
  else if (N.capped) out.push(`Long runs are capped at about 2.5 hours (around ${fmtDist(150 / P.pace)} at your easy pace). Your weekly miles do the rest of the endurance work.`);
  if (N.timeLimited){
    const t = N.timeLimited;
    out.push(`This plan usually peaks around ${fmtDist(t.target)} a week. At your easy pace, ${A.days} run days fit about ${fmtDist(t.fit)} without breaking the long-run and single-run caps, so that's your peak.` + (t.overStart ? ' Your current volume is already above that, so some weeks will come in under it.' : '') +
      (t.next && t.next > t.fit + 1 ? ` Adding one more easy day would raise it to about ${fmtDist(t.next)}.` : ''));
  }
  if (N.addDay && !N.timeLimited) out.push(+A.days < 6
    ? `Some weeks come up about ${fmtDist(N.addDay)} short of this plan's target, because long runs and single runs are capped. Adding one more easy run day would cover it.`
    : `Some weeks come up about ${fmtDist(N.addDay)} short of this plan's target because runs are capped. That's fine; the caps protect you.`);
  if (N.share) out.push('Your long run is more than 40% of some weeks. Adding a short run or a midweek medium-long run would spread the load.');
  if (A.benchKind === 'aspire') out.push('Your paces come from a best-guess time. Run a time trial in week 3 or 4 to check them.');
  out.push('Not medical advice. Listen to your body and adjust.');
  return out;
}
function drawPlan(){
  const W = P.weeks[wk];
  const today = new Date(); today.setHours(0,0,0,0);
  const first = W.days[0].date, last = W.days[6].date;
  const fmt = d => d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  const maxMi = Math.max(...P.weeks.flatMap(w => w.days.map(d => d.miles)), 1);
  const notes = noteList();
  const strip = W.days.map((d, i) => {
    const h = d.miles ? Math.max(8, Math.round(44 * d.miles / maxMi)) : 0;
    const isToday = +d.date === +today;
    return `<a href="#d${i}" class="${isToday ? 'is-today' : ''}"><span class="bars">
      ${d.miles ? `<span class="bar-run ${d.role === 'RACE' ? 'race' : ''}" style="height:${h}px"></span>` : ''}
      ${d.lift ? '<span class="bar-lift"></span>' : ''}${!d.miles && !d.lift ? '<span class="bar-rest"></span>' : ''}
      </span>${DAYS[(d.date.getDay() + 6) % 7].slice(0,2)}</a>`;
  }).join('');
  const cards = W.days.map((d, i) => {
    const isToday = +d.date === +today;
    const sum = [d.miles ? fmtDist(d.miles) : '', d.lift ? 'Strength' : ''].filter(Boolean).join(' · ') || 'Rest day';
    return `<details class="day ${isToday ? 'is-today' : ''}" id="d${i}" ${isToday ? 'open' : ''}>
      <summary><span class="dnum">${d.date.getDate()}</span>
        <span><span class="dn">${DAYS[(d.date.getDay() + 6) % 7]} · ${esc(d.title)}</span><br><span class="sumline">${sum}</span></span>
        <span class="dots">${d.miles ? '<i class="dot run"></i>' : ''}${d.lift ? '<i class="dot lift"></i>' : ''}</span></summary>
      <div class="daybody">
        ${d.role !== 'off' || d.miles ? `<div class="item run"><h3>${esc(d.title)}${d.miles ? ' · ' + fmtDist(d.miles) : ''}</h3><p>${esc(d.hint)}</p>${stepList(d.steps)}</div>` : `<div class="item"><p>${esc(d.hint)}</p></div>`}
        ${d.lift ? `<div class="item lift"><h3>${esc(d.lift)}</h3><p>${esc(liftHint(d.lift))}</p>${stepList(d.liftSteps)}</div>` : ''}
      </div></details>`;
  }).join('');
  const overview = P.weeks.map((w, i) => `<tr class="${i === wk ? 'cur' : ''}"><td><button data-week="${i}">Week ${i+1}</button></td><td>${PHASE_NAME[w.phase]}</td><td>${fmtDist(w.total)}</td></tr>`).join('');
  $('plan').innerHTML = `
    <p class="phase">${PHASE_NAME[W.phase]} phase · ${esc(A.distance)} plan</p>
    <div class="weekrow"><div>
      <p class="weekno">Week ${wk + 1}<small> / ${P.N}</small></p>
      <p class="dates">${fmt(first)} – ${fmt(last)} · ${fmtDist(W.total)}</p></div>
      <div class="nav"><button id="pprev" aria-label="Previous week" ${wk === 0 ? 'disabled' : ''}>‹</button>
      <button id="pnext" aria-label="Next week" ${wk === P.N - 1 ? 'disabled' : ''}>›</button></div></div>
    <p class="weeknote">${PHASE_NOTE[W.phase]}</p>
    <div class="strip">${strip}</div>
    <div class="legend"><span class="l-run">Run</span>${+A.strength ? '<span class="l-lift">Strength</span>' : ''}</div>
    ${cards}
    ${goalCard()}
    <details class="card notes" style="margin-top:16px"><summary>Notes on your plan (${notes.length})</summary>
      <ul>${notes.map(t => `<li style="margin:6px 0">${esc(t)}</li>`).join('')}</ul>
      ${(P.notes.addDay || (P.notes.timeLimited && P.notes.timeLimited.next)) && +A.days < 6 ? `<div class="planbtns" style="margin-top:8px"><button id="addday">Add a run day (${+A.days + 1} days)</button></div>` : ''}</details>
    <details class="card notes"><summary>All weeks</summary><table class="overview">${overview}</table></details>
    <div class="planbtns"><button id="editans">Edit answers</button></div>`;
  $('pprev').onclick = () => { if (wk > 0){ wk--; drawPlan(); } };
  $('pnext').onclick = () => { if (wk < P.N - 1){ wk++; drawPlan(); } };
  $('editans').onclick = showQuiz;
  if ($('addday')) $('addday').onclick = () => { A.days = +A.days + 1; save(); showPlan(); };
  $('plan').querySelectorAll('[data-week]').forEach(b => b.onclick = () => { wk = +b.dataset.week; drawPlan(); window.scrollTo(0, 0); });
}
function stepList(a){
  return a && a.length ? `<ul class="steps">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
}
function goalCard(){
  const g = P.goal; if (!g) return '';
  const label = {on:'On track', amb:'Ambitious', big:'Big stretch'}[g.tier];
  const msg = {
    on:'Your goal fits where your fitness is likely to be on race day.',
    amb:'Your goal is a bit faster than your projected range. Possible with a great block and a good day.',
    big:'Your goal is well beyond your projected range. Race-pace workouts use your projected pace instead, so the plan stays safe. Re-test partway through and update your benchmark if you\'re ahead of schedule.'
  }[g.tier];
  const caveat = [A.benchKind === 'aspire' ? 'Your benchmark is a best guess, so this is too. A time trial in week 3 or 4 will sharpen it.' : '',
    A.distance === 'Full' ? 'Marathon projections from shorter races run optimistic, especially for newer marathoners.' : ''].filter(Boolean).join(' ');
  return `<div class="card goal goal-${g.tier}" style="margin-top:16px"><h3>Goal check: ${label}</h3>
    <p style="margin:0 0 6px;font-size:15px">Projected race-day range: <b>${fmtSecs(g.fast)}–${fmtSecs(g.slow)}</b>. Your goal: <b>${fmtSecs(g.goal)}</b>.</p>
    <p style="margin:0;font-size:15px">${msg}</p>${caveat ? `<p class="quiet" style="margin:8px 0 0">${caveat}</p>` : ''}</div>`;
}
function liftHint(t){
  const eq = {bw:'Bodyweight', db:'Dumbbells/kettlebells', bb:'Barbell'}[A.equipment] || '';
  if (t.includes('heavy')) return `${eq}. After your run, ideally 6+ hours later. The first lift is the heavy one; the rest support it.`;
  if (t.includes('power')) return `${eq}. Fast, springy work for running power. Fresh legs matter more than fatigue here.`;
  if (t.includes('maintenance')) return `${eq}. One short session to hold your strength without adding fatigue.`;
  return `${eq}. Moderate effort, finish feeling like you had more in the tank.`;
}

if (A.built) showPlan(); else render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register("bb-sw.js").catch(() => {}));
}
</script>
</body>
</html>
