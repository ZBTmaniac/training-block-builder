// CUSTOM (UPLOADED) PLAN -> the same week/day shape the plan view uses
// =====================================================================
const ROLE_OF = {Quality:'Q', Tempo:'T', Long:'L', Easy:'E', Recovery:'R', Race:'RACE', Rest:'off'};
const SPORT_CLS = {Run:'run', Bike:'bike', Brick:'bike', Swim:'swim', Strength:'lift', Other:'other', Rest:''};
function sessionLabel(x){
  if (x.sport === 'Swim' && x.swimDist) return x.swimDist;
  return [x.miles ? fmtDist(x.miles) : '', x.mins ? `${x.mins} min` : ''].filter(Boolean).join(' · ');
}
function buildCustomPlan(){
  const C = A.custom, start = parseDate(A.startDate);
  const strengthLeft = {};
  Object.values(C.strength || {}).forEach(s => (strengthLeft[s.week] = strengthLeft[s.week] || []).push(s));
  const weeks = [];
  for (let w = 1; w <= C.weeks; w++){
    const days = [];
    for (let j = 0; j < 7; j++){
      const date = addDays(start, (w - 1) * 7 + j);
      const list = C.sessions.filter(x => x.week === w && x.day === j && x.sport !== 'Rest');
      const items = list.map(x => {
        let steps = x.steps;
        if (x.sport === 'Strength'){
          const pool = strengthLeft[w] || [];
          const k = pool.findIndex(s => normS(s.name) === normS(x.title) || normS(x.title).endsWith(' ' + normS(s.name)));
          const s = k >= 0 ? pool.splice(k, 1)[0] : null;
          if (s) steps = s.lines.concat(x.steps.filter(t => !/strength tab/i.test(t)));
        }
        return {cls: SPORT_CLS[x.sport] || 'other', sport: x.sport, title: x.title, sub: sessionLabel(x), hint: x.optional ? 'Optional' : x.sport === 'Strength' ? '' : `${x.type} · ${x.intensity}`, steps, x};
      });
      const main = list.find(x => !['Strength'].includes(x.sport) && !x.optional) || list.find(x => !['Strength'].includes(x.sport));
      const runMiles = list.filter(x => x.sport === 'Run' && !x.optional).reduce((t, x) => t + x.miles, 0);
      const load = list.filter(x => x.sport !== 'Strength' && !x.optional).reduce((t, x) => t + (x.mins ? x.mins / 9 : x.sport === 'Bike' ? x.miles / 3 : x.sport === 'Swim' ? 3 : x.miles), 0);
      days.push({date, role: main ? (main.sport === 'Run' ? ROLE_OF[main.type] || 'E' : 'X') : 'off', title: main ? main.title : (list.length ? list[0].title : 'Rest'),
        miles: runMiles, load, sport: main ? main.sport : '', lift: list.some(x => x.sport === 'Strength') ? 'Strength' : null, items, hint: HINT.off, steps: []});
    }
    // Strength from the Strength tab that wasn't placed in the plan tab: hard days first, never the day before a long run, 48 h apart
    const left = strengthLeft[w] || [];
    const order = [...days.keys()].sort((a, b) => ({Q:0, T:1, X:2, E:3, off:4, R:5}[days[a].role] ?? 9) - ({Q:0, T:1, X:2, E:3, off:4, R:5}[days[b].role] ?? 9));
    const usedIdx = days.map((d, i) => d.lift ? i : -1).filter(i => i >= 0);
    for (const s of left){
      const i = order.find(i => !['L','RACE'].includes(days[i].role) && !(days[i + 1] && ['L','Q','T','RACE'].includes(days[i + 1].role)) && !usedIdx.some(u => Math.abs(u - i) < 2) && days[i].items.length < 2);
      if (i === undefined) break;
      days[i].items.push({cls:'lift', sport:'Strength', title: s.name.length <= 2 ? 'Strength ' + s.name : s.name, sub:'', hint:'Placed for you, away from the day before your long run and hard runs.', steps: s.lines});
      days[i].lift = 'Strength'; usedIdx.push(i);
    }
    const total = days.reduce((t, d) => t + d.miles, 0);
    weeks.push({phase:'custom', days, total});
  }
  return {weeks, notes:{}, N: C.weeks, custom: true};
}
// Items to show for a day, for both generated and uploaded plans
function dayItems(d){
  if (d.items) return d.items;
  const out = [];
  if (d.role !== 'off' || d.miles) out.push({cls:'run', sport:'Run', title: d.title, sub: d.miles ? fmtDist(d.miles) : '', hint: d.hint, steps: d.steps});
  if (d.lift) out.push({cls:'lift', sport:'Strength', title: d.lift, sub:'', hint: liftHint(d.lift), steps: d.liftSteps});
  return out;
}
function planName(){ return A.mode === 'upload' ? (A.custom && A.custom.fileName ? A.custom.fileName.replace(/\.[^.]+$/, '') : 'My plan') : `${A.distance} training plan`; }

// =====================================================================
// MISSED TRAINING
// =====================================================================
let MS = {amount:null, why:null};
function curWeekIdx(){
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.min(Math.max(Math.floor((today - parseDate(A.startDate)) / (7 * 864e5)), 0), P.N - 1);
}
function keyOf(W, role){ return W ? W.days.find(d => d.role === role) : null; }
function missedNote(){
  const cur = curWeekIdx();
  const mi = MS.amount === 'days' ? cur : Math.max(0, cur - 1);
  const M = P.weeks[mi], C = P.weeks[cur];
  const mL = keyOf(M, 'L'), mQ = keyOf(M, 'Q'), cT = keyOf(C, 'T'), cL = keyOf(C, 'L');
  const big = MS.amount === 'more' || MS.why === 'sick';
  const p = [];
  if (big){
    p.push(MS.why === 'sick' ? '<b>Get healthy first.</b> Come back with a couple of easy runs before anything hard. If you were sick, wait until you\'ve been symptom-free for a day or two.' : '<b>Step back before stepping up.</b> After two or more weeks off, your body needs a short re-entry.');
    p.push('The best move is to rebuild the plan from next week, starting a bit below where you left off. That way you don\'t jump straight back into your old volume.');
    p.push('<b>Don\'t</b> try to make up the missed sessions. They\'re gone, and that\'s fine.');
    return p;
  }
  if (MS.amount === 'days'){
    p.push('<b>A few missed days won\'t dent your fitness.</b> Pick up wherever the plan is today.');
    if (mQ) p.push(`If you missed this week's <b>${esc(mQ.title.toLowerCase())}</b>, move it to your next easy day, as long as that isn't the day before your long run.`);
    p.push('<b>Don\'t</b> add the missed miles on top.');
    return p;
  }
  const building = [mL ? `a long run of ${fmtDist(mL.miles)}` : '', mQ && mQ.title !== mL?.title ? esc(mQ.title.toLowerCase()) : ''].filter(Boolean).join(' and ');
  p.push(`<b>You missed week ${mi + 1} (${PHASE_NAME[M.phase]}).</b>${building ? ` It was building toward ${building}.` : ''}`);
  if (mQ && cT && cur !== mi && mQ.title !== keyOf(C, 'Q')?.title) p.push(`<b>This week:</b> carry on as planned, but swap ${DAYS[(cT.date.getDay() + 6) % 7]}'s ${esc(cT.title.toLowerCase())} for the ${esc(mQ.title.toLowerCase())} you missed.`);
  else p.push('<b>This week:</b> carry on as planned.');
  if (mL && cL && cL.miles >= mL.miles) p.push(`Skip the missed long run. This week's (${fmtDist(cL.miles)}) covers it.`);
  else if (mL) p.push('Skip the missed long run. Run this week\'s as written.');
  p.push('<b>Don\'t</b> add the missed miles on top. One good week beats one crammed week.');
  return p;
}
function missedPanel(){
  const opt = (k, v, label) => `<button type="button" class="choice" data-ms="${k}" data-v="${v}" aria-pressed="${MS[k] === v}"><b>${label}</b></button>`;
  let h = `<h3>Missed some training?</h3>
    <p class="sub">Life happens. Tell us what you missed and we'll adjust.</p>
    <div class="choices" style="grid-template-columns:repeat(3,1fr)">${opt('amount','days','A few days')}${opt('amount','week','About a week')}${opt('amount','more','2+ weeks')}</div>
    <div class="choices two" style="margin-top:8px">${opt('why','busy','Life got busy')}${opt('why','sick','Sick or hurt')}</div>`;
  if (MS.amount && MS.why){
    h += `<div style="margin-top:12px;font-size:15px">${missedNote().map(t => `<p style="margin:0 0 8px">${t}</p>`).join('')}</div>`;
    if (MS.amount !== 'days' || MS.why === 'sick'){
      const race = A.timeline === 'race';
      h += `<div class="planbtns" style="margin-top:4px"><button id="pushback">${race ? 'Rebuild from next week' : 'Push plan back'}</button></div>
        <p class="quiet" style="margin:6px 0 0">${race ? 'Your race date stays fixed, so the rebuilt plan keeps your full taper and shortens the earlier phases instead.' : `Moves every remaining session back ${MS.amount === 'more' ? 'two weeks' : 'a week'}.`}</p>`;
    }
  }
  return h;
}
function missedClick(e){
  const b = e.target.closest('[data-ms]');
  if (b){ MS[b.dataset.ms] = b.dataset.v; $('missed').innerHTML = missedPanel(); return; }
  if (e.target.id === 'pushback') pushBack();
}
function pushBack(){
  const big = MS.amount === 'more' || MS.why === 'sick';
  if (A.timeline !== 'race'){
    A.startDate = iso(addDays(parseDate(A.startDate), MS.amount === 'more' ? 14 : 7));
  } else {
    const cur = curWeekIdx();
    const last = P.weeks[Math.max(0, cur - (MS.amount === 'days' ? 0 : 1) - 1)] || P.weeks[0];
    const newStart = nextMonday();
    const weeksLeft = Math.floor((parseDate(A.raceDate) - parseDate(newStart)) / (7 * 864e5)) + 1;
    if (weeksLeft < 2){ alertMsg('There isn\'t enough time before your race to rebuild. Run easy, keep your long run short, and race for fun.'); return; }
    const vol = last.total * (big ? (MS.amount === 'more' ? 0.7 : 0.8) : 0.95);
    A.volume = String(Math.round((A.units === 'km' ? vol * KM : vol) * 2) / 2);
    A.startDate = newStart;
  }
  MS = {amount:null, why:null}; A.ackTough = true; save(); showPlan();
}
function alertMsg(t){ const el = $('missed'); el.insertAdjacentHTML('beforeend', `<p class="flag" style="margin-top:8px">${esc(t)}</p>`); }

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
function sessionRows(){
  const rows = [];
  P.weeks.forEach((W, wi) => W.days.forEach(d => {
    if (!dayItems(d).length) return;
    rows.push({W, wi, d});
  }));
  return rows;
}
// ---------- calendar (.ics) ----------
function icsEsc(t){ return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line){
  const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0;
  for (const ch of line){
    const b = enc.encode(ch).length;
    if (bytes + b > (out.length ? 74 : 75)){ out.push(cur); cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n ');
}
function exportICS(){
  const today = new Date(); today.setHours(0,0,0,0);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Training Block Builder//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEsc(planName())];
  sessionRows().forEach(({wi, d}, i) => {
    if (d.date < today) return;
    const items = dayItems(d);
    const summary = items.map(it => it.sub && it.sport !== 'Strength' ? `${it.title} · ${it.sub}` : it.title).join(' + ');
    const desc = items.map(it => [it.title + (it.sub && it.sport !== 'Strength' ? ' · ' + it.sub : '') + ':', ...(it.steps || []).map(x => '• ' + x)].join('\n')).concat([`Week ${wi + 1} of ${P.N}`]).join('\n\n');
    L.push('BEGIN:VEVENT', `UID:tbb-${ymd(d.date)}-${i}@training-block-builder`, 'DTSTAMP:' + stamp,
      'DTSTART;VALUE=DATE:' + ymd(d.date), 'DTEND;VALUE=DATE:' + ymd(addDays(d.date, 1)),
      icsFold('SUMMARY:' + icsEsc(summary)), icsFold('DESCRIPTION:' + icsEsc(desc)), 'TRANSP:TRANSPARENT', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  download(new Blob([L.join('\r\n') + '\r\n'], {type:'text/calendar'}), `${planName()}.ics`.replace(/\s+/g, '-'));
}

// ---------- Excel (.xlsx, written by hand: a zip of a few XML files) ----------
function crc32(buf){
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++){
    let c = (crc ^ buf[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files, type){
  const enc = new TextEncoder(); const parts = [], central = []; let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((t, a) => t + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type});
}
const xmlEsc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join('') + '</row>').join('');
  const cols = (widths || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  const dvx = dv && dv.length ? `<dataValidations count="${dv.length}">${dv.map(([ref, list]) => `<dataValidation type="list" allowBlank="1" showErrorMessage="1" errorStyle="warning" errorTitle="Not in the list" error="Pick from the list, or keep your own value and the app will try to read it." sqref="${ref}"><formula1>"${xmlEsc(list.join(','))}"</formula1></dataValidation>`).join('')}</dataValidations>` : '';

// sheets: [{name, rows, widths, dv}]
function xlsxBlob(sheets){

    {name:'xl/styles.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},

  return zipStore(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
// Export: one row per session, in the upload template's columns (plus Date and Phase), so it can be edited and re-uploaded
function exportXLSX(){
  const unit = A.units;
  const TYPE = {Q:'Quality', T:'Tempo', L:'Long', E:'Easy', R:'Recovery', RACE:'Race', off:'Rest'};
  const INT = {Q:'Hard', T:'Hard', L:'Moderate', RACE:'Hard'};
  const rows = [['Week', 'Day', 'Sport', 'Type', 'Title', 'Details', 'Distance', 'Duration (min)', 'Intensity', 'Date', 'Phase']];
  const strength = [['Week', 'Session', 'Exercise', 'Sets × reps', 'Load', 'Notes']];
  P.weeks.forEach((W, wi) => W.days.forEach(d => {
    const day = DAYS[(d.date.getDay() + 6) % 7], phase = PHASE_NAME[W.phase] || '';
    const items = dayItems(d);
    if (!items.length){ rows.push([wi + 1, day, 'Rest', 'Rest', 'Rest', '', '', '', '', iso(d.date), phase]); return; }
    items.forEach((it, k) => {
      const x = it.x;
      if (it.sport === 'Strength'){
        const sess = `Strength ${String.fromCharCode(65 + strength.filter(r => r[0] === wi + 1).map(r => r[1]).filter((v, i, a) => a.indexOf(v) === i).length)}`;
        rows.push([wi + 1, day, 'Strength', '', it.title.startsWith('Strength') && !x ? sess : it.title, 'See the Strength tab', '', x && x.mins ? x.mins : '', x ? x.intensity : 'Moderate', iso(d.date), phase]);
        (it.steps || []).forEach(line => strength.push([wi + 1, it.title.startsWith('Strength') && !x ? sess : it.title, line, '', '', '']));
        return;
      }
      const dist = x ? (x.sport === 'Swim' ? x.swimDist : x.miles ? Math.round((unit === 'km' ? x.miles * KM : x.miles) * 10) / 10 : '')
                     : d.miles ? Math.round((unit === 'km' ? d.miles * KM : d.miles) * 2) / 2 : '';
      rows.push([wi + 1, day, x ? x.sport : 'Run', x ? x.type : (TYPE[d.role] || 'Easy'), it.title, (it.steps || []).join(' | '), dist, x && x.mins ? x.mins : '', x ? x.intensity : (INT[d.role] || 'Easy'), iso(d.date), phase]);
    });
  }));
  const dv = [['B2:B2500', DAYS], ['C2:C2500', SPORTS], ['D2:D2500', TYPES], ['I2:I2500', INTENSITIES]];
  download(xlsxBlob([{name:'Plan', rows, widths:[7, 8, 10, 10, 26, 70, 10, 14, 11, 12, 10], dv},
                     ...(strength.length > 1 ? [{name:'Strength', rows: strength, widths:[7, 22, 70, 12, 10, 20]}] : [])]),
    `${planName()}.xlsx`.replace(/\s+/g, '-'));
}

if (A.built) showPlan(); else render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register("bb-sw.js").catch(() => {}));
}
</script>
