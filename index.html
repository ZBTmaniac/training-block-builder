<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Block Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Training Block Builder</title>
<link rel="manifest" href="bb-manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="bb-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="bb-icon-512.png">
<meta name="theme-color" content="#E9ECE6">
<style>
:root{
  --bg:#E9ECE6; --surface:#F6F7F3; --ink:#1E2422; --muted:#5E6762; --line:#CBD1CA;
  --run:#2F55A4; --bike:#1F7A68; --swim:#2B86B5; --lift:#B4721A; --rest:#9AA39E;
  --display:"Avenir Next Condensed","DIN Condensed","Arial Narrow",sans-serif;
  --body:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Color-blind friendly palette (Okabe-Ito); every color also has a text label */
:root{--race:var(--lift)}
html[data-palette="cb"]{--run:#0072B2; --bike:#009E73; --swim:#56B4E9; --lift:#E69F00; --rest:#8C8C8C; --race:#D55E00}
@media (prefers-color-scheme: dark){
  html[data-palette="cb"]{--run:#4FA3E0; --bike:#2FC29A; --swim:#9DD8F7; --lift:#F2B63C; --rest:#8C8C8C; --race:#F07A3A}
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151A1D; --surface:#1E2529; --ink:#E4E8E3; --muted:#9AA49F; --line:#313A3F;
    --run:#86A3E6; --bike:#5CC0A8; --swim:#6CC3E8; --lift:#E0A44E; --rest:#5E6762;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone zooms the page (and shifts it sideways) when a focused field's text is under 16px */
input,select,textarea{font-size:16px!important}
html,body{overflow-x:hidden}
:focus-visible{outline:2px solid var(--run);outline-offset:2px}

.step{font-size:14px;color:var(--muted);margin:4px 0 0}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.5px;margin:6px 0 6px}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.progress{display:flex;gap:5px;margin:10px 0 0}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--run)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:17px}
.card .sub{margin:0 0 10px;font-size:14px;color:var(--muted)}

.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(56px,1fr))}
.choice{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer}
.choices.row .choice{text-align:center;padding:12px 4px}
.choice b{display:block;font-weight:600}
.choice span{display:block;font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border:2px solid var(--run);padding:11px 13px;background:var(--surface)}
.choices.row .choice[aria-pressed="true"]{padding:11px 3px}

label.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
label.field:last-child{border-bottom:none}
label.field input,label.field select{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:150px;min-width:0}
.time{display:flex;gap:4px;align-items:center}
.time input{width:52px!important;text-align:center;padding:8px 4px!important}

.flag{border-left:3px solid var(--lift);padding:2px 0 2px 12px;margin:12px 0 0;font-size:14px}
.flag b{color:var(--lift)}
@media (prefers-color-scheme: light){.flag b{color:#8A5410}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.err{color:#B3261E;font-size:14px;margin:10px 0 0;min-height:1em}
@media (prefers-color-scheme: dark){.err{color:#F2B8B5}}

.review{width:100%;border-collapse:collapse;font-size:15px}
.review td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.review td:first-child{color:var(--muted);width:42%}
.review td:last-child{text-align:right}
.review button{border:none;background:none;color:var(--run);cursor:pointer;padding:0 0 0 8px;font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.bar button{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.bar button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar button[hidden]{display:none}
.bar button:disabled{opacity:.4;cursor:default}
/* Plan view tabs: a phone-style bar at the bottom, always visible */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar div{max-width:640px;margin:0 auto;display:flex;gap:4px}
.tabbar button{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:600}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink);background:var(--bg)}
.tabbar button[aria-selected="true"] svg{stroke:var(--run)}
.tabhead{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin:6px 0 4px}
.nexttabs{display:flex;gap:10px;margin:20px 0 0}
.nexttabs button{flex:1;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.updatebar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;max-width:616px;margin:0 auto;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.updatebar button{flex:none;border:0;border-radius:20px;padding:8px 14px;background:var(--bg);color:var(--ink);font-weight:600;cursor:pointer}
.dayedit{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.dayedit select{margin-left:8px}
.nexttabs b{display:block}.nexttabs span{font-size:13px;color:var(--muted)}
.quiet{font-size:13px;color:var(--muted)}

/* ---------- plan view ---------- */
.phase{font-size:14px;color:var(--muted);margin:4px 0 0}
.weekrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.weekno{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,64px);white-space:nowrap;line-height:.9;letter-spacing:-1px;margin:4px 0 0}
.weekno small{font-size:28px;color:var(--muted);font-weight:600;letter-spacing:0}
.dates{font-size:15px;color:var(--muted);margin:6px 0 0}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.nav button:disabled{opacity:.35}
.weeknote{margin:12px 0 0;font-size:15px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px}
.strip a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:12px}
.strip a.is-today{color:var(--ink);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px}
.bar-run{width:7px;border-radius:2px;background:var(--run)}
.bar-run.race{background:var(--race)}
.bar-run.bike{background:var(--bike)} .bar-run.swim{background:var(--swim)} .bar-run.other{background:var(--rest)}
.bar-lift{width:7px;height:10px;border-radius:2px;background:var(--lift)}
.bar-rest{background:var(--rest);height:4px;width:4px;border-radius:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 14px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend .l-run::before{background:var(--run)} .legend .l-lift::before{background:var(--lift)} .legend .l-bike::before{background:var(--bike)} .legend .l-swim::before{background:var(--swim)} .legend .l-other::before{background:var(--rest)}
.issues{margin:6px 0 0;padding-left:18px;font-size:14px}
.issues li{margin:4px 0}
.filebtn{display:block;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:16px;cursor:pointer;background:var(--bg);font-weight:600}
.filebtn input{display:none}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
details.day.is-today{border:2px solid var(--ink)}
details.day summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px}
details.day summary::-webkit-details-marker{display:none}
.dnum{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center}
.dn{font-weight:600}
.sumline{font-size:14px;color:var(--muted)}
.dots{margin-left:auto;display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.run{background:var(--run)} .dot.lift{background:var(--lift)} .dot.bike{background:var(--bike)} .dot.swim{background:var(--swim)} .dot.other{background:var(--rest)}
.daybody{padding:0 14px 14px}
.item{border-left:3px solid var(--rest);padding:2px 0 2px 12px;margin:12px 0}
.item.run{border-color:var(--run)} .item.lift{border-color:var(--lift)} .item.bike{border-color:var(--bike)} .item.swim{border-color:var(--swim)}
.item h3{font-size:16px;margin:0 0 2px}
.item p{margin:0;font-size:15px}
.notes summary{cursor:pointer;font-weight:600;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary::after{content:" ▾";color:var(--muted)}
.planbtns{display:flex;gap:10px;margin:18px 0 0}
.planbtns button{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.overview{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.overview td{padding:6px 0;border-bottom:1px solid var(--line)}
.overview td:last-child{text-align:right}
.overview tr.cur td{font-weight:700}
.steps{margin:8px 0 0;padding-left:18px;font-size:15px}
.steps li{margin:3px 0}
.goal{border-left:4px solid var(--bike)}
.goal.goal-amb{border-left-color:var(--lift)}
.goal.goal-big{border-left-color:#B3261E}
.overview button{border:none;background:none;color:var(--run);cursor:pointer;font:inherit;padding:0}
#print{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff;color:#000;font-size:10pt}
  body::before{display:none}
  main > section, nav{display:none!important}
  #print{display:block!important}
  #print h1{font-size:20pt;margin:0 0 4pt}
  #print h2{font-size:12pt;margin:12pt 0 4pt;break-after:avoid}
  #print table{width:100%;border-collapse:collapse;break-inside:auto}
  #print td,#print th{border-bottom:0.5pt solid #bbb;padding:3pt 4pt;vertical-align:top;text-align:left}
  #print tr{break-inside:avoid}
  #print .muted{color:#555}
  #print .blk + .blk{margin-top:6pt;padding-top:5pt;border-top:0.5pt dashed #ccc}
  #print .lbl{font-weight:600;font-size:9pt;color:#555;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2pt}
  #print ul{margin:0;padding-left:12pt}
  #print li{margin:0 0 2.5pt}
}
</style>
</head>
<body>
<main>
  <section id="quiz">
    <p class="step" id="step"></p>
    <div class="progress" id="progress"></div>
    <div id="screen"></div>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section id="plan" hidden></section>
</main>
<nav class="tabbar" id="tabbar" aria-label="Plan sections" hidden><div role="tablist" aria-label="Plan sections">
  <button role="tab" id="tab-week" aria-controls="pane-week" data-tab="week" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>This week</button>
  <button role="tab" id="tab-plan" aria-controls="pane-plan" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Whole plan</button>
  <button role="tab" id="tab-take" aria-controls="pane-take" data-tab="take" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>Export &amp; sync</button>
</div></nav>
<div id="print"></div>
<nav class="bar" id="quizbar"><div>
  <button id="back">Back</button>
  <button id="next" class="primary">Next</button>
</div></nav>

<script>
const APP_VERSION = '0.13.3';   // shown in the plan view; bump with each release
// ---------- state ----------
const KEY = 'tbb-answers-v1';
const DEFAULTS = {
  distance:null, experience:null, units:'mi', volume:'',
  timeline:'race', raceDate:'', weeks:12, startDate:nextMonday(),
  benchKind:'race', benchDist:'5K', benchTime:{h:'',m:'',s:''}, goalTime:{h:'',m:'',s:''},
  days:null, longDay:'Sat', qualityDay:'Tue',
  strength:null, equipment:null,
  expert:false, ackTough:false,
  lthr:'', lthrSource:'test', effort:'pace',
  mode:'gen', custom:null,
  heat:'', heatVsTraining:'', canRun:'', rwRepeats:[], glossaryOk:false, tuneStyle:'steady', tuneCap:70, tuneOpen:false, swaps:[], eased:[], checkins:[], raceResult:null, palette:'std'
};
let A = load();
let idx = 0;

function load(){
  try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch(e){ return Object.assign({}, DEFAULTS); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(A)); } catch(e){} }

// ---------- helpers ----------
function nextMonday(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + (8 - d.getDay()) % 7);   // today if it's Monday, else the coming Monday
  return iso(d);
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function weeksBetween(a,b){ return Math.floor((parseDate(b) - parseDate(a)) / (7*864e5)); }
function secs(t){ const h=+t.h||0, m=+t.m||0, s=+t.s||0; return h*3600+m*60+s; }
function fmtTime(t){ const x=secs(t); if(!x) return '—'; const h=Math.floor(x/3600), m=Math.floor(x%3600/60), s=x%60;
  return (h? h+':'+String(m).padStart(2,'0') : m)+':'+String(s).padStart(2,'0'); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function choices(name, opts, cls=''){
  return `<div class="choices ${cls}">` + opts.map(o =>
    `<button type="button" class="choice" data-name="${name}" data-val="${esc(o.v)}" aria-pressed="${String(A[name])===String(o.v)}">
       <b>${esc(o.label)}</b>${o.sub ? `<span>${esc(o.sub)}</span>` : ''}</button>`).join('') + '</div>';
}
function timeInputs(name){
  const t = A[name];
  return `<span class="time">
    <input inputmode="numeric" maxlength="2" placeholder="h" data-time="${name}" data-part="h" value="${esc(t.h)}" aria-label="hours">:
    <input inputmode="numeric" maxlength="2" placeholder="mm" data-time="${name}" data-part="m" value="${esc(t.m)}" aria-label="minutes">:
    <input inputmode="numeric" maxlength="2" placeholder="ss" data-time="${name}" data-part="s" value="${esc(t.s)}" aria-label="seconds"></span>`;
}
function daySelect(name){
  return `<select data-field="${name}">` + DAYS.map(d => `<option ${A[name]===d?'selected':''}>${d}</option>`).join('') + '</select>';
}

// ---------- screens ----------
const SCREENS = [
  {
    title:'What are you training for?',
    lead:'Pick your goal distance. You can build another plan any time.',
    render: () => choices('distance', [
      {v:'5K', label:'5K', sub:'3.1 mi'}, {v:'10K', label:'10K', sub:'6.2 mi'},
      {v:'Half', label:'Half marathon', sub:'13.1 mi'}, {v:'Full', label:'Marathon', sub:'26.2 mi'}
    ], 'two') + `<p class="quiet" style="margin:12px 0 0"><a href="${RULES_URL}" target="_blank" rel="noopener">How plans are built, with sources</a> · <a href="https://github.com/ZBTmaniac/training-block-builder/issues/new?template=feedback.yml" target="_blank" rel="noopener">Send feedback</a></p><div class="card" style="margin-top:16px"><h3>Already have a plan?</h3>
      <p class="sub">Upload it from a spreadsheet and use this app to follow it, add strength, and export it.</p>
      <button type="button" class="choice" data-upload="1"><b>Upload my own plan</b><span>Excel or CSV</span></button></div>
      <div class="card"><h3>Moving to a new phone or browser?</h3>
      <p class="sub">Restore the backup file you saved from this app and pick up where you left off.</p>
      <button type="button" class="choice" data-restore="1"><b>Restore from a backup</b><span>A .json file saved from Training Block Builder</span></button></div>`,
    check: () => A.distance ? '' : 'Pick a distance to continue.'
  },
  {
    title:'Where are you starting?',
    lead:'This sets your starting volume. Plans build from where you are now, not where you want to be.',
    render: () => `
      <div class="card"><h3>Running experience</h3>
      ${choices('experience', [
        {v:'new', label:'New to running', sub:'Little or no regular running yet'},
        {v:'some', label:"I've trained before", sub:'Done a plan or a few races'},
        {v:'regular', label:'I train regularly', sub:'Structured training most of the year'}
      ])}
      <p class="quiet" style="margin:10px 0 0"><b>Why we ask:</b> experience sets how fast the plan builds and which options you see. If you're between two, pick the lower one; you can change it later.</p></div>
      <div class="card"><h3>Recent weekly volume</h3>
      <p class="sub">Your average over the last 4 weeks. 0 is fine.</p>
      <label class="field">Per week <input type="number" inputmode="decimal" min="0" data-field="volume" value="${esc(A.volume)}" placeholder="e.g. 15"></label>
      <div style="margin-top:10px">${choices('units', [{v:'mi',label:'Miles'},{v:'km',label:'Kilometers'}], 'two')}</div>
      </div>
      ${askCanRun() ? `<div class="card"><h3>How long can you run right now without stopping?</h3>
        <p class="sub">At an easy pace, without walk breaks. Your best guess is fine.</p>
        ${choices('canRun', [{v:'none', label:'Not yet'}, {v:'lt5', label:'Under 5 minutes'}, {v:'5to15', label:'5–15 minutes'}, {v:'15to25', label:'15–25 minutes'}, {v:'30', label:'30 minutes or more'}])}
        <details style="margin-top:10px"><summary class="quiet" style="cursor:pointer">Not sure? An optional quick check</summary>
          <p class="quiet" style="margin:8px 0 0">Walk briskly for 5 minutes to warm up. Then run at a pace where you could still talk, and stop when you need to walk. The time on your watch is your answer. No need to push: this is about where to start, not a test you can fail.</p></details>
      </div>` : ''}`,
    check: () => {
      if (!A.experience) return 'Pick your experience level.';
      if (askCanRun() && !A.canRun) return 'Pick how long you can run without stopping.';
      if (A.volume === '' || isNaN(+A.volume) || +A.volume < 0) return 'Enter your recent weekly volume (0 is fine).';
      if (!A.expert && +A.volume > (A.units==='mi'?150:240)) return 'That volume looks too high. Check the units.';
      return '';
    }
  },
  {
    title:'When is it?',
    lead:'Training for a race? Use its date. Otherwise pick a plan length.',
    render: () => `
      <div class="card">${choices('timeline', [{v:'race',label:'Race date'},{v:'length',label:'Plan length'}], 'two')}
      <div style="margin-top:8px">
        <label class="field">Start date <input type="date" data-field="startDate" value="${esc(A.startDate)}"></label>
        ${A.timeline==='race'
          ? `<label class="field">Race date <input type="date" data-field="raceDate" value="${esc(A.raceDate)}"></label>`
          : `<label class="field">Weeks <select data-field="weeks">${[6,8,10,12,14,16,18,20].map(w=>`<option ${+A.weeks===w?'selected':''}>${w}</option>`).join('')}</select></label>`}

    check: () => {

  {

let expertAsk = false;
function expertCard(){
  if (A.expert) return `<div class="card"><h3>Expert mode is on</h3>
    <p class="sub">Volume, distance and time safety checks are off. The plan builds whatever you ask for.</p>
    <button type="button" class="choice" data-expert="off"><b>Turn expert mode off</b></button></div>`;
  if (expertAsk) return `<div class="card"><h3>Are you sure?</h3>
    <p class="sub">This removes volume, distance, and time safety checks. The plan will build whatever you ask for, even if it makes no sense.</p>
    <div class="choices two"><button type="button" class="choice" data-expert="cancel"><b>Cancel</b></button>
    <button type="button" class="choice" data-expert="on"><b>Yes, turn it on</b></button></div></div>`;
  return `<div class="card"><h3>Experienced runner?</h3>
    <p class="sub">Turn off the caps on long runs, single runs, and weekly volume. Off by default.</p>
    <button type="button" class="choice" data-expert="ask"><b>I know what I'm doing</b></button></div>`;
}
// ---------- race-day heat ----------
const HEAT = {
  cool:{label:'Cool', sub:'Under 55°F / 13°C'}, mild:{label:'Mild', sub:'55–65°F / 13–18°C'},
  warm:{label:'Warm', sub:'65–75°F / 18–24°C'}, hot:{label:'Hot', sub:'Over 75°F / 24°C'}, unsure:{label:'Not sure', sub:'We\'ll keep it neutral'}
};
const isHotRace = () => A.timeline === 'race' && (A.heat === 'warm' || A.heat === 'hot');
function heatCard(){
  return `<div class="card"><h3>How warm will race day likely be?</h3>
    <p class="sub">Your best guess for the time of day you'll be racing. Humidity makes any of these feel hotter.</p>
    ${choices('heat', Object.entries(HEAT).map(([v, h]) => ({v, label: h.label, sub: h.sub})), 'two')}
    ${isHotRace() ? `<h3 style="margin-top:14px">Compared with the weather you train in?</h3>
      ${choices('heatVsTraining', [{v:'similar', label:'About the same'}, {v:'hotter', label:'Hotter than I train in'}], 'two')}` : ''}
    <details style="margin-top:12px"><summary class="quiet" style="cursor:pointer">How heat affects racing, and what to do about it</summary>
      <div style="font-size:14px;margin-top:8px">
        <p style="margin:0 0 8px"><b>Expect to slow down.</b> Most runners race best somewhere around 45–60°F (7–15°C). Above that, the same pace takes more effort. In marathons, mid-pack runners slow by roughly 4–5 seconds per mile for every °C (about 2°F) above 60°F, and humidity makes it worse. Shorter races are affected less.</p>
        <p style="margin:0 0 8px"><b>Your body adapts in 1–2 weeks.</b> With regular heat exposure, most adaptations happen within 7–14 days: lower heart rate at the same effort, more blood plasma, and earlier, heavier sweating.</p>
        <p style="margin:0 0 8px"><b>How to adapt:</b> do some easy runs in the warmest part of the day, or sit in a sauna or hot bath right after a run. Start with 10–15 minutes and build toward 20–30. Keep the runs easy, drink plenty, and stop if you feel dizzy, confused, or stop sweating. We don't recommend overdressing (sweat suits and extra layers): it's riskier, and there's little evidence it helps athletes already trained for their race.</p>
        <p style="margin:0 0 8px"><b>On race day:</b> start slower than goal pace, drink to thirst with some sodium, pour water over yourself at aid stations, and adjust your goal to the conditions. Pacing by effort or heart rate works better than pace in the heat.</p>
        <p class="quiet" style="margin:0">If you pick Warm or Hot, the plan adds heat-adaptation work in the two weeks before race week and race-day heat tips.</p>
      </div></details></div>`;
}
function heatSlowdown(){
  // ~4–4.5 s/mi per °C above ~15°C for mid-pack marathoners; scaled by distance
  if (!isHotRace()) return null;
  const overC = A.heat === 'hot' ? [9, 13] : [3, 8];
  const scale = {'5K':0.35, '10K':0.5, 'Half':0.75, 'Full':1}[A.distance] || 1;
  return overC.map(c => Math.round(c * 4.25 * scale / (A.units === 'km' ? KM : 1)));
}
function timelineNote(){
  if (A.timeline!=='race' || !A.raceDate || !A.startDate) return '';
  const w = weeksBetween(A.startDate, A.raceDate);
  return w >= 3 ? `<p class="quiet" style="margin:10px 0 0">That's a ${w}-week plan.</p>` : '';
}
function strengthNote(){
  if (A.strength === null) return '';
  if (+A.strength === 0) return `<p class="flag"><b>Worth reconsidering:</b> runners who lift get hurt less and hold their form better late in races. Even one session a week helps. Your choice stands.</p>`;
  if (A.equipment === 'bw') return `<p class="flag"><b>Good start.</b> Bodyweight work still needs to get hard to keep helping. The plan uses single-leg moves and a loaded backpack so it can.</p>`;
  return '';
}
function reviewRows(){
  const exp = {new:'New to running', some:"I've trained before", regular:'I train regularly'}[A.experience];
  const eq = {bw:'Bodyweight', db:'Dumbbells / kettlebells', bb:'Barbell / gym'}[A.equipment];
  const when = A.timeline==='race' ? `Race ${A.raceDate} (${weeksBetween(A.startDate,A.raceDate)} wks)` : `${A.weeks} weeks`;
  const bench = A.benchKind==='none' ? 'Skipped' : `${A.benchDist} ${fmtTime(A.benchTime)}${A.benchKind==='aspire'?' (aspirational)':''}`;
  return [
    ['Goal', A.distance, 0],
    ['Experience', exp, 1],
    ['Weekly volume', `${A.volume} ${A.units}`, 1],
    ['Timeline', when, 2],
    ['Start', A.startDate, 2],
    ...(A.timeline === 'race' ? [['Race-day weather', A.heat ? HEAT[A.heat].label + (isHotRace() && A.heatVsTraining === 'hotter' ? ', hotter than training' : '') : '—', 2]] : []),
    ['Benchmark', bench, 3],
    ['Goal time', fmtTime(A.goalTime), 3],
    ['Threshold HR', A.lthr !== '' ? `${A.lthr} bpm${A.lthrSource === 'watch' ? ' (watch)' : ''}, show ${A.effort === 'hr' ? 'HR' : 'pace'}` : '—', 3],
    ['Run days', `${A.days} per week`, 4],
    ['Long run / hard day', `${A.longDay} / ${A.qualityDay}`, 4],

  ];
}

// ---------- render + events ----------
const $ = id => document.getElementById(id);
function render(){
  const s = SCREENS[idx];

  $('progress').innerHTML = SCREENS.map((_,i) => `<i class="${i<=idx?'on':''}"></i>`).join('');
  $('screen').innerHTML = `<h1>${s.title}</h1><p class="lead">${s.lead}</p><h2 class="sr">Your answers</h2>` + s.render();
  $('err').textContent = '';
  $('back').hidden = idx === 0;
  $('next').textContent = idx === SCREENS.length-1 ? 'Build my plan' : 'Next';
}
function rerender(){ // keep scroll + focus-friendly redraw within a screen
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

$('screen').addEventListener('click', e => {
  const x = e.target.closest('[data-expert]');
  if (x){
    const v = x.dataset.expert;
    if (v === 'ask') expertAsk = true;
    if (v === 'cancel') expertAsk = false;
    if (v === 'on'){ A.expert = true; expertAsk = false; }
    if (v === 'off'){ A.expert = false; if (+A.days < 3 || +A.days > 6) A.days = null; }
    A.ackTough = false; save(); rerender(); return;
  }
  if (uploadMode){ uploadClick(e); return; }
  if (e.target.closest('[data-upload]')){ showUpload(); return; }
  if (e.target.closest('[data-restore]')){ pickRestore(); return; }
  if (ackMode){ ackClick(e); return; }
  if (glossMode) return;
  const c = e.target.closest('.choice');
  if (c){
    const name = c.dataset.name; let v = c.dataset.val;
    if (['days','strength'].includes(name)) v = +v;
    A[name] = v;
    if (name==='strength' && v===0) A.equipment = null;
    A.ackTough = false; save(); rerender(); return;
  }
  const g = e.target.closest('[data-goto]');
  if (g){ idx = +g.dataset.goto; render(); window.scrollTo(0,0); }
});
$('screen').addEventListener('input', e => {
  const t = e.target;
  if (uploadMode){ uploadInput(e); return; }
  if (t.dataset.field){ A[t.dataset.field] = t.value; A.ackTough = false; save(); }
  if (t.id === 'ackbox'){ $('next').disabled = !t.checked; return; }
  if (t.dataset.time){ t.value = t.value.replace(/\D/g,''); A[t.dataset.time] = Object.assign({}, A[t.dataset.time], {[t.dataset.part]: t.value}); save(); }
  if ($('goallive') && (t.dataset.time || t.dataset.field === 'benchDist')) $('goallive').innerHTML = goalLive();
  $('err').textContent = '';
});
$('screen').addEventListener('change', e => {
  if (uploadMode){ if (e.target.type === 'file') handleFile(e.target.files[0]); else uploadInput(e); return; }
  // iPhone date pickers can report only 'change', so store the value here too
  if (e.target.dataset.field){ A[e.target.dataset.field] = e.target.value; A.ackTough = false; save(); }
  // redraw for fields that change what the screen shows
  if (['raceDate','startDate','benchDist','lthr'].includes(e.target.dataset.field)) rerender();
});

$('next').addEventListener('click', () => {
  if (uploadMode){ importUpload(); return; }
  if (glossMode){ A.glossaryOk = true; glossMode = false; save(); if (needsAck()){ showAck(); return; } A.built = true; save(); showPlan(); return; }
  const msg = SCREENS[idx].check();
  if (msg){ $('err').textContent = msg; return; }
  if (idx < SCREENS.length-1){ idx++; render(); window.scrollTo(0,0); }
  else {
    if (ackMode){
      if (!$('ackbox') || !$('ackbox').checked){ $('err').textContent = 'Check the box to go ahead, or pick one of the options.'; return; }
      A.ackTough = true; ackMode = false; $('next').disabled = false; A.built = true; save(); showPlan(); return;
    }
    for (let i = 0; i < SCREENS.length; i++){ const m = SCREENS[i].check(); if (m){ idx = i; render(); $('err').textContent = m; return; } }
    if (needsGlossary()){ showGlossary(); return; }
    if (needsAck()){ showAck(); return; }
    A.built = true; save(); showPlan();
  }
});
$('back').addEventListener('click', () => {
  if (uploadMode){ uploadMode = false; $('next').disabled = false; idx = 0; render(); window.scrollTo(0,0); return; }
  if (glossMode){ glossMode = false; render(); window.scrollTo(0,0); return; }
  if (ackMode){ ackMode = false; $('next').disabled = false; render(); window.scrollTo(0,0); return; }
  if (idx > 0){ idx--; render(); window.scrollTo(0,0); }
});

// ---------- "know what you're signing up for" (marathon, slower or short timeline) ----------
let ackMode = false, glossMode = false;
function needsGlossary(){ return !A.glossaryOk && needsRunWalk() && !buildPlanAll().notes.rwOnly; }
function showGlossary(){
  glossMode = true;
  const rw = buildPlanAll().notes.rwThen;
  $('step').textContent = 'Before you start';
  $('screen').innerHTML = `<h1>A few running words</h1>
    <p class="lead">Your first ${rw ? rw.rwWeeks : 'few'} weeks are run-walk and need none of this. After that, your plan uses these terms, so here's what they mean. You can find this again in your plan anytime.</p>
    <div class="card">${glossaryHTML()}</div>`;
  $('err').textContent = ''; $('back').hidden = false; $('next').textContent = "I've read it, build my plan";
  window.scrollTo(0, 0);
}
function toughNotes(){
  if (A.expert || A.distance !== 'Full') return null;
  const t = buildPlanAll().notes;
  // Stop-and-read page only when the peak lands well short of what a marathon plan usually needs.
  // Smaller gaps and faster ramps stay as notes in the plan.
  if (!t.timeLimited && !t.outkick) return null;
  const usual = t.timeLimited ? t.timeLimited.target : t.outkick.target;
  // If even 6 days and the longest weekday runs can't fit the usual peak, it's pace, not a choice: no stop page, just a note.
  const paceBound = t.timeLimited && t.timeLimited.best < 0.85 * t.timeLimited.target;
  const reached = Math.min(t.timeLimited && !paceBound ? t.timeLimited.fit : Infinity, t.outkick ? t.outkick.peak : Infinity);
  if (!isFinite(reached)) return null;
  return reached < 0.85 * usual ? Object.assign({}, t, {reached, usual}) : null;
}
function needsAck(){ return !A.ackTough && !!toughNotes(); }
function showAck(){
  const t = toughNotes(); ackMode = true;
  const lines = [];
  if (t.timeLimited && t.timeLimited.fit < 0.85 * t.timeLimited.target) lines.push(`At your easy pace, ${A.days} run days fit about ${fmtDist(t.timeLimited.fit)} a week within the safety caps. Marathon plans like this usually peak around ${fmtDist(t.timeLimited.target)}.`);
  if (t.outkick) lines.push(`Your timeline is too short to build safely to the usual peak. The plan tops out near ${fmtDist(t.outkick.peak)}.`);
  else if (t.compressed) lines.push('Your timeline is short, so volume steps up every 2 weeks with no cutback weeks.');
  lines.push('Lower training volume makes the last miles of a marathon much harder. That can mean a lot of walking.');
  $('step').textContent = 'Before we build';
  $('screen').innerHTML = `<h1>Know what you're signing up for</h1>
    <p class="lead">You can absolutely do this. It's a tough build, so here are the tradeoffs.</p>
    <div class="card"><ul style="margin:0;padding-left:20px">${lines.map(l => `<li style="margin:6px 0;font-size:15px">${esc(l)}</li>`).join('')}</ul></div>
    <div class="card"><h3>Ways to make it easier</h3>
      <div class="choices">
        <button type="button" class="choice" data-ack="later"><b>Pick a later race or longer plan</b><span>More weeks to build volume safely</span></button>
        ${+A.days < 6 ? `<button type="button" class="choice" data-ack="day"><b>Add a run day (${+A.days + 1} days)</b><span>More room in each week</span></button>` : ''}
      </div></div>
    <div class="card"><label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer">
      <input type="checkbox" id="ackbox" style="width:22px;height:22px;margin-top:1px;flex:none">
      <span>I understand this volume may not be enough to run the whole marathon comfortably, and I want to go ahead.</span></label></div>`;
  $('err').textContent = '';
  $('back').hidden = false;
  $('next').textContent = 'Build my plan'; $('next').disabled = true;
  window.scrollTo(0, 0);
}
function ackClick(e){
  const b = e.target.closest('[data-ack]');
  if (!b) return;
  ackMode = false; $('next').disabled = false;
  if (b.dataset.ack === 'later'){ idx = 2; render(); window.scrollTo(0,0); }
  if (b.dataset.ack === 'day'){ A.days = +A.days + 1; save(); if (needsAck()) showAck(); else { A.built = true; save(); showPlan(); } }
}

// =====================================================================
// PLAN ENGINE (v0.2 skeleton). Rules come from the Rules Spec doc.
// Everything is computed in miles; converted for display.
// =====================================================================
const KM = 1.609344;
const LEVEL = {new:'new', some:'some', regular:'regular'};
// Peak weekly volume bands (mi) by distance and experience
const BANDS = {
  '5K':  {new:[10,15], some:[20,30], regular:[30,45]},
  '10K': {new:[12,18], some:[22,32], regular:[32,50]},
  'Half':{new:[20,25], some:[25,35], regular:[35,50]},
  'Full':{new:[35,45], some:[40,55], regular:[55,65]}
};
// Minimum starting volume a plan needs (mi/week)
const FLOOR = {'5K':6, '10K':8, 'Half':8, 'Full':10};
// Long run share of the week by run days
const LONG_SHARE = {1:1, 2:0.6, 3:0.40, 4:0.33, 5:0.30, 6:0.27, 7:0.25};
// Long run the plan builds toward by the peak phase (mi), before time/distance caps
const LR_PEAK = {
  '5K':{new:5, some:7, regular:9}, '10K':{new:6, some:8, regular:10},
  'Half':{new:10, some:12, regular:13}, 'Full':{new:16, some:18, regular:20}
};
const DIST_MI = {'1 mile':1, '5K':3.107, '10K':6.214, 'Half':13.109, 'Full':26.219};
const PHASE_NAME = {base:'Base', build:'Build', peak:'Peak', taper:'Taper', custom:'', runwalk:'Getting started'};
const PHASE_NOTE = {
  base:'Building the engine. Mostly easy running, with short fast strides and hills to stay sharp.',
  build:'Quality work ramps up. Hard days are hard, easy days stay truly easy.',
  peak:'Race-specific work. The biggest weeks of the plan.',
  taper:'Less volume, same sharpness. Trust the training.',
  runwalk:'Building up to 30 minutes of running. If a week felt hard, repeat it. That\'s normal, and it\'s how this is meant to work.'
};

function volMi(){ const v = +A.volume || 0; return A.units === 'km' ? v / KM : v; }
function fmtDist(mi){ const v = A.units === 'km' ? mi * KM : mi; return (Math.round(v * 2) / 2).toString().replace(/\.0$/, '') + ' ' + A.units; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const r5 = x => Math.round(x * 2) / 2;

// Easy pace (min/mi) from the benchmark, or a default by experience
function easyPace(){
  if (A.benchKind !== 'none' && secs(A.benchTime)){
    const d = DIST_MI[A.benchDist];
    const t5k = secs(A.benchTime) * Math.pow(3.107 / d, 1.06);   // Riegel to a 5K equivalent
    return Math.min(14, Math.max(7, (t5k / 60 / 3.107) * 1.32)); // easy ≈ 5K pace + ~30%
  }
  return {new:12, some:10.5, regular:9.25}[A.experience];
}

function planWeeks(){
  if (A.timeline === 'race'){
    const days = Math.round((parseDate(A.raceDate) - parseDate(A.startDate)) / 864e5);
    return Math.floor(days / 7) + 1;
  }
  return +A.weeks;
}

// Base -> build -> peak -> taper. Base grows with the gap between start and target volume.
function phaseList(N, gap){
  const D = A.distance;
  const taper = Math.min(N, D === 'Full' ? (N >= 16 ? 3 : 2) : D === 'Half' ? (N >= 10 ? 2 : 1) : 1);
  let peak = (D === 'Full' || D === 'Half') ? 3 : 2;
  if (N < 8) peak = Math.max(1, peak - 1);
  peak = Math.max(0, Math.min(peak, N - taper));
  const rest = Math.max(0, N - taper - peak);
  let base = rest < 2 ? rest : Math.min(rest - 1, Math.max(1, Math.round(rest * (0.4 + 0.3 * gap))));
  const build = rest - base;
  return [...Array(base).fill('base'), ...Array(build).fill('build'), ...Array(peak).fill('peak'), ...Array(taper).fill('taper')];
}

// Step-up ramp: hold a level, then step. Normal = 3 weeks + a cutback week; compressed = 2-week holds.
function rampVolumes(start, target, rampWeeks, notes, style = 'steady'){
  if (rampWeeks <= 0 || target <= start) return {levels: Array(rampWeeks).fill(start), cut: Array(rampWeeks).fill(false), peak: Math.max(start, target)};
  if (style === 'daniels'){
    // Hold 3 weeks, then add about 1 mile per run day (Daniels caps the step at 10)
    const step = Math.min(+A.days || 5, 10), levels = [];
    for (let w = 0; w < rampWeeks; w++) levels.push(Math.min(target, start + step * Math.floor(w / 3)));
    const top = Math.min(target, start + step * Math.floor(rampWeeks / 3));
    if (top < target - 0.5) notes.styleShort = {peak: top, target};
    notes.style = 'daniels';
    return {levels, cut: Array(rampWeeks).fill(false), peak: top};
  }
  if (style === 'aggressive'){
    const B = Math.ceil(rampWeeks / 2);
    let r = Math.pow(target / start, 1 / B), peak = target;
    if (r > 1.30){ r = 1.30; peak = start * Math.pow(r, B); notes.styleShort = {peak, target}; }
    notes.style = 'aggressive';
    return {levels: Array.from({length: rampWeeks}, (_, w) => start * Math.pow(r, Math.floor(w / 2))), cut: Array(rampWeeks).fill(false), peak};
  }
  const tryMode = h => { const B = Math.ceil(rampWeeks / h); return {h, B, r: Math.pow(target / start, 1 / B)}; };
  let m = tryMode(4), mode = 'normal';
  if (m.r - 1 > 0.20){ m = tryMode(2); mode = 'compressed'; }   // Daniels: hold 3–4 weeks, then add about 1 mile per run (often ~20%)
  let peak = target;
  if (!A.expert && m.r - 1 > 0.20){ m.r = 1.20; peak = start * Math.pow(1.2, m.B); mode = 'compressed'; notes.outkick = {peak, target}; }
  if (mode === 'compressed') notes.compressed = true;
  const levels = [], cut = [];
  for (let w = 0; w < rampWeeks; w++){
    const block = Math.floor(w / m.h), inBlock = w % m.h;
    let v = start * Math.pow(m.r, block);
    const c = mode === 'normal' && inBlock === 3;            // cutback week
    if (c) v *= 0.8;
    levels.push(v); cut.push(c);
  }
  return {levels, cut, peak};
}

// Which weekday (0=Mon..6=Sun) gets which role
function weekLayout(){
  const n = +A.days, L = DAYS.indexOf(A.longDay), Q = DAYS.indexOf(A.qualityDay);
  const roles = Array(7).fill('off');
  roles[L] = 'L';
  if (n === 1) return roles;
  const Qd = Q === L ? (L + 3) % 7 : Q;
  roles[Qd] = 'Q';
  if (n === 2) return roles;
  const dist = (a, b) => { const g = Math.abs(a - b); return Math.min(g, 7 - g); };
  // Tempo: as far from both the long run and the quality day as possible, prefer after the quality day
  let best = -1, bestScore = -1;
  for (let d = 0; d < 7; d++){
    if (roles[d] !== 'off') continue;
    const score = Math.min(dist(d, L), dist(d, Qd)) * 10 + ((d - Qd + 7) % 7 < (Qd - d + 7) % 7 ? 1 : 0);
    if (score > bestScore){ bestScore = score; best = d; }
  }
  roles[best] = 'T';
  // Extra easy days: recovery after the long run, then around the quality day; never the day before the long run unless needed
  const T = best;
  const pref = [(L + 1) % 7, (Qd + 1) % 7, (Qd + 6) % 7, (T + 1) % 7, (T + 6) % 7, 0,1,2,3,4,5,6, (L + 6) % 7];
  let extra = n - 3;
  for (const d of pref){
    if (extra <= 0) break;
    if (roles[d] !== 'off' || (d === (L + 6) % 7 && pref.indexOf(d) < pref.length - 1)) continue;
    roles[d] = (d === (L + 1) % 7 && n >= 5) ? 'R' : 'E'; extra--;
  }
  for (let d = 0; extra > 0 && d < 7; d++) if (roles[d] === 'off'){ roles[d] = 'E'; extra--; }
  return roles;
}

// ---------- paces and effort ----------
// Latest check-in result (optionally only ones matching a test)
function lastCheck(test = () => true){
  const c = (A.checkins || []).filter(test).sort((a, b) => a.date < b.date ? 1 : -1);
  return c[0] || null;
}
function benchT5k(){
  const ck = lastCheck(c => c.t5k);
  if (ck) return ck.t5k;
  if (A.benchKind === 'none' || !secs(A.benchTime)) return null;
  return secs(A.benchTime) * Math.pow(3.107 / DIST_MI[A.benchDist], 1.06);
}
// Training paces in sec/mile, from a 5K-equivalent of the benchmark
function paceZones(){
  const t5 = benchT5k(); if (!t5) return null;
  const p5 = t5 / 3.107;
  const z = {E:p5 * 1.32, steady:p5 * 1.2, MP:p5 * 1.15, HM:p5 * 1.09, T:p5 * 1.075, '10K':p5 * 1.042, '5K':p5, R:p5 * 0.94};
  const g = secs(A.goalTime);
  z.race = g ? g / DIST_MI[A.distance] : {'5K':z['5K'], '10K':z['10K'], 'Half':z.HM, 'Full':z.MP}[A.distance];
  return z;
}
const ZONE_LABEL = {E:'easy', steady:'steady', MP:'marathon pace', HM:'half-marathon pace', T:'threshold', '10K':'10K pace', '5K':'5K pace', R:'mile pace', race:'goal race pace'};
const ZONE_RPE = {E:'2–3', steady:'5', MP:'5–6', HM:'6–7', T:'7', '10K':'8', '5K':'8–9', R:'9'};
function fmtPace(sPerMi){
  const s = Math.round(A.units === 'km' ? sPerMi / KM : sPerMi);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '/' + A.units;
}
let Z = null;   // set per plan build
// Heart-rate targets as % of threshold HR. Short, fast reps have none: HR lags behind the effort.
const HR_PCT = {E:[0, 0.89], steady:[0.87, 0.91], MP:[0.89, 0.93], HM:[0.93, 0.97], T:[0.95, 1.0], '10K':[0.99, 1.02], '5K':null, R:null};
function lthrVal(){ const ck = lastCheck(c => c.lthr); if (ck) return ck.lthr; const v = +A.lthr; return A.lthr !== '' && v > 0 ? v : 0; }
function hrText(key){
  const l = lthrVal(); if (!l) return '';
  const k = key === 'race' ? {'5K':'5K', '10K':'10K', 'Half':'HM', 'Full':'MP'}[A.distance] : key;
  const r = HR_PCT[k]; if (!r) return '';
  return r[0] === 0 ? `under ${Math.round(l * r[1])} bpm` : `${Math.round(l * r[0])}–${Math.round(l * r[1])} bpm`;
}
const PLAIN_LABEL = {E:'an easy, chatty pace', steady:'a steady, comfortable effort', MP:'marathon effort', HM:'half-marathon effort', T:'a comfortably hard effort', '10K':'a hard but controlled effort', '5K':'a hard effort', R:'a fast effort', race:'your race effort'};
const isNew = () => A.experience === 'new' && A.mode !== 'upload';
// Easy-pace phrasing without "easy at easy": "(9:30/mi, RPE 2–3)", or plain words for new runners
function eff(key){
  if (isNew() && key === 'E') return '— slow enough to talk in full sentences. Walk breaks are fine.';
  const a = at(key); return a.replace(/^at [^(]*\(/, '(');
}
function at(key){
  if (isNew()){
    const rpe0 = key === 'race' ? {'5K':'8–9', '10K':'8', 'Half':'6–7', 'Full':'5–6'}[A.distance] : ZONE_RPE[key];
    const pace0 = Z && Z[key] ? `, about ${fmtPace(Z[key])}` : '';
    return `at ${PLAIN_LABEL[key]} (effort ${rpe0} out of 10${pace0})`;
  }
  const rpe = key === 'race' ? {'5K':'8–9', '10K':'8', 'Half':'6–7', 'Full':'5–6'}[A.distance] : ZONE_RPE[key];
  const label = key === 'race' && Z && Z.raceProj ? 'projected race pace' : ZONE_LABEL[key];
  const useHR = lthrVal() && (A.effort === 'hr' || !Z);
  const hr = useHR ? hrText(key) : '';
  if (hr) return `at ${label} (${hr}, RPE ${rpe})`;
  return Z ? `at ${label} (${fmtPace(Z[key])}, RPE ${rpe})` : `at ${label} (RPE ${rpe})`;
}

// ---------- workouts ----------
function workoutSteps(d, phase, f, k, pace){
  const D = A.distance, lvl = A.experience, short = D === '5K' || D === '10K';
  const n = (lo, hi) => Math.round(lo + (hi - lo) * f);
  // Keep the main set to ~60% of the day's distance so warm-up and cool-down fit
  const fit = (reps, repMi) => Math.max(2, Math.min(reps, Math.floor(0.6 * d.miles / repMi)));
  const fitMin = (reps, min) => fit(reps, min / (pace * 0.8));
  const WU = 'Warm up: 10–15 min easy, then 4 strides';
  const CD = "Cool down: easy running to finish the day's distance";
  const long = d.miles * pace > 75;
  const fuel = 'Practice fueling: carbs every 30–45 min';
  switch (d.kind){
    case 'E': return ['Easy the whole way ' + eff('E')].concat(d.strides ? ['Finish with 6 × 20 s strides: quick and relaxed, full recovery between'] : []);
    case 'R': return ['Slower than easy. Skip it if you feel beat up.'];
    case 'MLR': return ['Easy the whole way ' + eff('E')].concat(long ? [fuel] : []);
    case 'SH': return ['15–20 min very easy', '4 × 20 s strides'];
    case 'CHK': return ['Warm up: 15 min easy, then 4 strides',
      'Run 30 minutes as hard as you can hold evenly, on your own (not with a group). Press lap at 10 minutes.',
      'Afterward, note the distance you covered and your average heart rate for the last 20 minutes',
      'Cool down: 10 min easy',
      'Test in conditions like the ones you train in. Heat, cold, and humidity all shift heart rate and pace.'].concat(
      D === 'Half' || D === 'Full' ? [`Or race a ${D === 'Full' ? '10K or half marathon' : '10K'} this week instead and enter that result. A 10K or longer race works for threshold HR too; a 5K runs high.`] : ['Or race a 5K or 10K this week instead and enter that time.']);
    case 'TT': return [WU, `Run ${D === 'Full' ? 'a hard 10K' : D === 'Half' ? 'a hard 10K' : 'your ' + D} as a time trial, or at goal effort`, 'Cool down: 10 min easy'];
    case 'RACE': return ['Start a touch slower than goal pace for the first mile', 'Settle in ' + at('race')].concat(D === 'Full' || D === 'Half' ? ['Fuel the way you practiced: carbs every 30–45 min'] : ['Hold back for the first half, then race the second']);
    case 'Q': {
      if (phase === 'base'){
        if (lvl === 'new') return ['Easy ' + eff('E'), 'Finish with 4–6 × 20 s strides'];
        return k % 2 ? [WU, `${n(6, 10)} × 30 s hill sprints, hard but controlled; walk down to recover`, CD]
                     : [WU, `Fartlek: ${n(6, 10)} × 1 min ${at('10K')}, 1 min easy between`, CD];
      }
      if (phase === 'taper') return [WU, short ? `${n(4, 6)} × 400 m ${at('race')}, full recovery` : `3 × 1 km ${at('race')}, 2 min jog`, CD];
      if (lvl === 'new') return [WU, `Fartlek: ${n(5, 8)} × 1–2 min comfortably hard (RPE 7), 2 min easy between`, CD];
      if (phase === 'peak' && D === '5K') return [WU, `${fit(n(8, 12), 0.25)} × 400 m ${at('race')}, 200 m jog`, CD];
      if (phase === 'peak' && D === '10K') return [WU, `${fit(n(4, 6), 0.62)} × 1 km ${at('race')}, 400 m jog`, CD];
      const ff = phase === 'peak' ? 1 : f;
      const m = (lo, hi) => Math.round(lo + (hi - lo) * ff);
      if (short) return [WU, lvl === 'regular' ? `${fit(m(5, 6), 0.62)} × 1 km ${at('5K')}, 2–3 min jog` : `${fit(m(5, 6), 0.5)} × 800 m ${at('5K')}, equal-time jog`, CD];
      return [WU, lvl === 'regular' ? `${fit(m(4, 6), 1)} × 1600 m ${at('10K')}, 2–3 min jog` : `${fit(m(6, 8), 0.5)} × 800 m ${at('10K')}, 400 m jog`, CD];
    }
    case 'T': {
      if (phase === 'taper') return ['Easy ' + eff('E'), 'Finish with 4–6 × 20 s strides'];
      if (phase === 'base'){
        if (lvl === 'new') return ['Easy the whole way ' + eff('E')];
        return ['Easy for the first half ' + eff('E'), `Then ${n(15, 25)} min ${at('steady')}`, 'Easy to finish'];
      }
      if (phase === 'peak'){
        if (short) return [WU, lvl === 'new' ? `${n(2, 3)} × 5 min ${at('T')}, 2 min easy jog` : `Cruise intervals: ${fit(n(4, 5), 1)} × 1600 m ${at('T')}, 1 min rest`, CD];
        if (D === 'Half') return [WU, lvl === 'new' ? `2 × ${fmtDist(1.5)} ${at('race')}, 3 min easy` : `${fit(n(2, 3), 2.5)} × ${fmtDist(2)} ${at('race')}, 800 m float at steady pace`, CD];
        return ['Easy ' + eff('E'), `Last ${n(15, 20)} min ${at('steady')}`, 'Kept light on purpose: the long run carries goal-pace work this phase'];
      }
      if (lvl === 'new') return [WU, `${n(2, 3)} × 5 min ${at('T')}, 2 min easy jog`, CD];
      if (lvl === 'some') return [WU, `Float set: ${fitMin(n(3, 4), 8)} × 6 min ${at('T')}, 2 min float at steady pace (keep moving, no full stops)`, CD];
      return [WU, `Float set: ${fitMin(n(3, 5), 10)} × 8 min ${at('T')}, 2 min float at steady pace (keep moving, no full stops)`, CD];
    }
    case 'L': {
      if (phase === 'taper') return ['Easy and relaxed ' + eff('E'), 'Shorter on purpose. Arrive at the start line fresh.'];
      const base = ['Easy the whole way ' + eff('E'), 'Even effort beats even pace on hills'];
      const rehearse = 'Dress rehearsal: race-morning breakfast, race kit and shoes, race-day fueling';
      if (phase !== 'peak') return base.concat(long ? [fuel] : []);
      if (D === 'Full'){
        const mp = lvl === 'new' ? `Last ${fmtDist(3)} ${at('race')}` : lvl === 'some' ? `2 × ${fmtDist(3)} ${at('race')}, ${fmtDist(1)} easy between` : `Middle ${fmtDist(n(8, 12))} ${at('race')}`;
        return (d.rehearsal ? [rehearse] : []).concat(['Easy ' + eff('E') + ' to start', mp, 'Easy to finish', fuel]);
      }
      if (D === 'Half' && lvl !== 'new') return (d.rehearsal ? [rehearse] : []).concat(['Easy ' + eff('E'), `Last ${fmtDist(n(2, 3))} ${at('race')}`]).concat(long ? [fuel] : []);
      return (d.rehearsal && !short ? [rehearse] : []).concat(base).concat(long ? [fuel] : []);
    }
  }
  return [];
}

// ---------- structured workouts (for watch files) ----------
// A step: {kind: warmup|active|recovery|rest|cooldown, dur: {s}|{m}|{open}, zone, name}; a repeat: {repeat: n, steps: [...]}.
// Mirrors workoutSteps() so the watch file and the written steps match.
const MI_M = 1609.344;
function workoutStruct(d, phase, f, k, pace){
  if (!d.miles || ['off'].includes(d.role)) return null;
  const D = A.distance, lvl = A.experience, short = D === '5K' || D === '10K';
  const n = (lo, hi) => Math.round(lo + (hi - lo) * f);
  const fit = (reps, repMi) => Math.max(2, Math.min(reps, Math.floor(0.6 * d.miles / repMi)));
  const fitMin = (reps, min) => fit(reps, min / (pace * 0.8));
  const T = (s, zone, kind = 'active', name = '') => ({kind, dur: {s: Math.round(s)}, zone, name});
  const M = (m, zone, kind = 'active', name = '') => ({kind, dur: {m: Math.round(m)}, zone, name});
  const MI = (mi, zone, kind = 'active', name = '') => M(mi * MI_M, zone, kind, name);
  const O = (zone, kind, name) => ({kind, dur: {open: 1}, zone, name});
  const R = (times, ...steps) => ({repeat: times, steps});
  const WU = T(900, 'E', 'warmup', 'Warm up');
  const CD = O('E', 'cooldown', 'Cool down (lap to end)');
  const strides = c => R(c, T(20, null, 'active', 'Stride'), T(60, null, 'recovery', 'Walk or jog'));
  const easyAll = (name = 'Easy') => MI(d.miles, 'E', 'active', name);
  switch (d.kind){
    case 'E': return d.strides ? [MI(Math.max(0.5, d.miles - 0.3), 'E', 'active', 'Easy'), strides(6)] : [easyAll()];
    case 'R': return [easyAll('Recovery, slower than easy')];
    case 'MLR': return [easyAll('Medium-long, easy')];
    case 'SH': return [T(1050, 'E', 'active', 'Very easy'), strides(4)];
    case 'CHK': return [T(900, 'E', 'warmup', 'Warm up'), strides(4), T(600, null, 'active', 'Time trial: first 10 min'), T(1200, null, 'active', 'Time trial: last 20 min'), T(600, 'E', 'cooldown', 'Cool down')];
    case 'TT': return [WU, M((D === 'Full' || D === 'Half' ? 6.214 : DIST_MI[D]) * MI_M, 'race', 'active', 'Time trial'), T(600, 'E', 'cooldown', 'Cool down')];
    case 'RACE': return [MI(DIST_MI[D], 'race', 'active', 'Race')];
    case 'Q': {
      if (phase === 'base'){
        if (lvl === 'new') return [MI(Math.max(0.5, d.miles - 0.3), 'E', 'active', 'Easy'), strides(5)];
        return k % 2 ? [WU, R(n(6, 10), T(30, null, 'active', 'Hill sprint'), T(90, null, 'recovery', 'Walk down')), CD]
                     : [WU, R(n(6, 10), T(60, '10K', 'active', 'Fartlek'), T(60, 'E', 'recovery', 'Easy')), CD];
      }
      if (phase === 'taper') return [WU, short ? R(n(4, 6), M(400, 'race'), T(120, 'E', 'recovery')) : R(3, M(1000, 'race'), T(120, 'E', 'recovery')), CD];
      if (lvl === 'new') return [WU, R(n(5, 8), T(90, null, 'active', 'Comfortably hard'), T(120, 'E', 'recovery')), CD];
      if (phase === 'peak' && D === '5K') return [WU, R(fit(n(8, 12), 0.25), M(400, 'race'), M(200, 'E', 'recovery')), CD];
      if (phase === 'peak' && D === '10K') return [WU, R(fit(n(4, 6), 0.62), M(1000, 'race'), M(400, 'E', 'recovery')), CD];
      const ff = phase === 'peak' ? 1 : f, m = (lo, hi) => Math.round(lo + (hi - lo) * ff);
      if (short) return [WU, lvl === 'regular' ? R(fit(m(5, 6), 0.62), M(1000, '5K'), T(150, 'E', 'recovery')) : R(fit(m(5, 6), 0.5), M(800, '5K'), M(400, 'E', 'recovery')), CD];
      return [WU, lvl === 'regular' ? R(fit(m(4, 6), 1), M(1600, '10K'), T(150, 'E', 'recovery')) : R(fit(m(6, 8), 0.5), M(800, '10K'), M(400, 'E', 'recovery')), CD];
    }
    case 'T': {
      if (phase === 'taper') return [MI(Math.max(0.5, d.miles - 0.3), 'E', 'active', 'Easy'), strides(5)];
      if (phase === 'base'){
        if (lvl === 'new') return [easyAll()];
        const st = n(15, 25);
        return [MI(d.miles / 2, 'E', 'active', 'Easy'), T(st * 60, 'steady', 'active', 'Steady'), O('E', 'cooldown', 'Easy to finish')];
      }
      if (phase === 'peak'){
        if (short) return [WU, lvl === 'new' ? R(n(2, 3), T(300, 'T'), T(120, 'E', 'recovery')) : R(fit(n(4, 5), 1), M(1600, 'T', 'active', 'Cruise'), T(60, null, 'rest', 'Rest')), CD];
        if (D === 'Half') return [WU, lvl === 'new' ? R(2, MI(1.5, 'race'), T(180, 'E', 'recovery')) : R(fit(n(2, 3), 2.5), MI(2, 'race'), M(800, 'steady', 'recovery', 'Float')), CD];
        const st = n(15, 20);
        return [MI(Math.max(1, d.miles - st / (pace * 0.92)), 'E', 'active', 'Easy'), T(st * 60, 'steady', 'active', 'Steady')];
      }
      if (lvl === 'new') return [WU, R(n(2, 3), T(300, 'T'), T(120, 'E', 'recovery')), CD];
      if (lvl === 'some') return [WU, R(fitMin(n(3, 4), 8), T(360, 'T', 'active', 'Threshold'), T(120, 'steady', 'recovery', 'Float, keep moving')), CD];
      return [WU, R(fitMin(n(3, 5), 10), T(480, 'T', 'active', 'Threshold'), T(120, 'steady', 'recovery', 'Float, keep moving')), CD];
    }
    case 'L': {
      if (phase !== 'peak') return [easyAll('Long run, easy')];
      if (D === 'Full'){
        if (lvl === 'new') return [MI(Math.max(1, d.miles - 3), 'E', 'active', 'Easy'), MI(3, 'race', 'active', 'Goal pace')];
        if (lvl === 'some') return [MI(Math.max(1, d.miles - 7), 'E', 'active', 'Easy'), R(2, MI(3, 'race', 'active', 'Goal pace'), MI(1, 'E', 'recovery', 'Easy')), O('E', 'cooldown', 'Easy to finish')];
        const mp = n(8, 12);
        return [MI(Math.max(1, (d.miles - mp) / 2), 'E', 'active', 'Easy'), MI(mp, 'race', 'active', 'Goal pace'), O('E', 'cooldown', 'Easy to finish')];
      }
      if (D === 'Half' && lvl !== 'new'){ const ff = n(2, 3); return [MI(Math.max(1, d.miles - ff), 'E', 'active', 'Easy'), MI(ff, 'race', 'active', 'Goal pace')]; }
      return [easyAll('Long run, easy')];
    }
  }
  return null;
}
// Target for a zone: pace range (sec/mi, slow..fast) or HR range, matching what the text shows
function zoneTarget(zone){
  if (!zone) return null;
  const l = lthrVal();
  const useHR = l && (A.effort === 'hr' || !Z);
  if (useHR){
    const k = zone === 'race' ? {'5K':'5K', '10K':'10K', 'Half':'HM', 'Full':'MP'}[A.distance] : zone;
    const r = HR_PCT[k];

function sessionTitle(role, phase, week, ctx){

    if (phase === 'peak') return lvl === 'new' ? 'Fartlek' : short ? 'Race-pace reps' : 'Intervals';

  for (let i = planHead.row + 1; i < rows.length; i++){
    const r = rows[i] || [], rn = i + 1;
    const get = k => col(k) >= 0 ? r[col(k)] : '';
    if (!r.some(c => String(c ?? '').trim() !== '')) continue;
    seenAnything = true;
    const wRaw = get('week'), wM = /(\d+)/.exec(String(wRaw ?? ''));
    const week = wM ? +wM[1] : NaN;
    if (!week || week < 1 || week > 104){ problems.push(`Row ${rn}: Week "${wRaw}" isn't a week number. Row skipped.`); continue; }
    let day = mapSyn('day', get('day'));
    if ((day === null || day === '') && /^[1-7]$/.test(String(get('day')).trim())) day = +String(get('day')).trim() - 1;
    if (day === null || day === ''){ problems.push(`Row ${rn}: Day "${get('day')}" isn't a day of the week. Use Mon–Sun. Row skipped.`); continue; }
    let sport = mapSyn('sport', get('sport')), type = mapSyn('type', get('type'));
    if (sport === null){ warnings.push(`Row ${rn}: Sport "${get('sport')}" isn't one we know, so it's listed as Other.`); sport = 'Other'; }
    if (type === null){ warnings.push(`Row ${rn}: Type "${get('type')}" isn't one we know, so it's treated as Easy.`); type = 'Easy'; }
    if (!sport) sport = type === 'Rest' ? 'Rest' : 'Run';
    if (!type) type = sport === 'Rest' ? 'Rest' : sport === 'Strength' ? '' : 'Easy';
    if (sport === 'Rest') type = 'Rest';
    let intensity = mapSyn('intensity', get('intensity'));
    if (intensity === null){
      const num = +String(get('intensity')).replace(/[^\d.]/g, '');
      intensity = num ? (num >= 7 ? 'Hard' : num >= 5 ? 'Moderate' : 'Easy') : '';
      if (!num) warnings.push(`Row ${rn}: Intensity "${get('intensity')}" isn't Easy, Moderate, or Hard, so it was left blank.`);
    }
    if (!intensity) intensity = ({Quality:'Hard', Tempo:'Hard', Race:'Hard', Long:'Moderate'})[type] || 'Easy';
    // distance
    let miles = 0, swimDist = '';
    const dn = parseNumber(get('distance'));
    if (dn.bad) warnings.push(`Row ${rn}: Distance "${get('distance')}" isn't a number, so it was left blank.`);
    else if (dn.n !== null){
      if (dn.range) warnings.push(`Row ${rn}: Distance "${get('distance')}" is a range, so we used the middle (${dn.n}).`);
      if (sport === 'Swim'){
        const u = dn.unit === 'yd' || dn.unit === 'm' ? dn.unit : (UPF.units === 'mi' ? 'yd' : 'm');
        swimDist = `${Math.round(dn.n)} ${u}`;
      } else {
        const u = dn.unit === 'km' || dn.unit === 'mi' ? dn.unit : (headerUnit === 'km' || headerUnit === 'mi' ? headerUnit : UPF.units);
        miles = u === 'km' ? dn.n / KM : dn.n;
        if (miles > 200){ warnings.push(`Row ${rn}: ${dn.n} ${u} looks too long for one session, so it was left blank.`); miles = 0; }
      }
    }
    let mins = 0;
    const dm = parseMinutes(get('duration'));
    if (Number.isNaN(dm)) warnings.push(`Row ${rn}: Duration "${get('duration')}" isn't a time we can read (try 60, 1:30 or 1h 30m), so it was left blank.`);
    else if (dm) mins = dm;
    const title = String(get('title') ?? '').trim() || (sport === 'Strength' ? 'Strength' : sport === 'Rest' ? 'Rest' : `${type} ${sport.toLowerCase()}`.replace(/^Easy run$/, 'Easy run'));
    const details = String(get('details') ?? '').trim();
    const steps = details ? details.split(/\s*\|\s*|\r?\n|;\s+/).filter(Boolean) : [];
    const optional = /^optional\b/i.test(String(get('type') ?? '').trim()) || /^optional\b/i.test(title);
    sessions.push({row: rn, week, day, sport, type, intensity, title, steps, miles: Math.round(miles * 10) / 10, mins: Math.round(mins), swimDist, ...(optional ? {optional: true} : {}), ...(get('workout') ? {workout: String(get('workout')).replace(/\r/g, '').trim()} : {})});
  }
  if (!seenAnything) return {fatal: 'The plan tab has a header row but no sessions under it.'};
  // strength tab
  const strength = {};
  if (strSheet){
    const R = sheets[strSheet], SH = strHead.keys, sc = k => SH.indexOf(k);
    for (let i = strHead.row + 1; i < R.length; i++){
      const r = R[i] || [], rn = i + 1;
      if (!r.some(c => String(c ?? '').trim() !== '')) continue;
      const g = k => sc(k) >= 0 ? String(r[sc(k)] ?? '').trim() : '';
      const wM = /(\d+)/.exec(g('week'));
      if (!wM){ problems.push(`${strSheet} tab, row ${rn}: Week "${g('week')}" isn't a week number. Row skipped.`); continue; }
      if (!g('exercise')){ warnings.push(`${strSheet} tab, row ${rn}: no exercise name, so the row was skipped.`); continue; }
      const sess = g('session') || 'A';
      const key = `${+wM[1]}|${sess.toLowerCase()}`;
      (strength[key] = strength[key] || {week: +wM[1], name: sess, lines: []}).lines.push(
        g('exercise') + ([g('sets'), g('load')].filter(Boolean).length ? ': ' + [g('sets'), g('load')].filter(Boolean).join(' at ') : '') + (g('details') ? ` (${g('details')})` : ''));
    }
  }
  const weeks = Math.max(...sessions.map(x => x.week), 1);
  const used = new Set(sessions.map(x => x.week));
  const empty = []; for (let w = 1; w <= weeks; w++) if (!used.has(w)) empty.push(w);
  if (empty.length) warnings.push(`Week${empty.length > 1 ? 's' : ''} ${empty.join(', ')} ha${empty.length > 1 ? 've' : 's'} no sessions, so ${empty.length > 1 ? 'they' : 'it'} will show as rest.`);
  const plan = {fileName, weeks, sessions, strength, problems, warnings};
  plan.placement = placementWarnings(plan);
  return plan;
}


// ---------- weekly-grid layout: weeks down the side, days across the top, a day's training as text in each cell ----------
function dayName(c){
  const t = normS(c).replace(/[.:]/g, '');
  if (!t || t.length < 2) return null;
  if (SYN.day[t] !== undefined) return SYN.day[t];
  const m = /^day\s*(\d)$/.exec(t); return m && +m[1] >= 1 && +m[1] <= 7 ? +m[1] - 1 : null;
}
function findGrid(rows){
  for (let i = 0; i < Math.min(rows.length, 40); i++){
    const r = rows[i] || [], dayCols = {};
    r.forEach((c, ci) => { const d = dayName(c); if (d !== null && !Object.values(dayCols).includes(d)) dayCols[ci] = d; });
    if (Object.keys(dayCols).length < 5) continue;
    // week labels: the column (left of the days) whose cells below read like "Week 3" or "3"
    let weekCol = -1, best = 0;
    const width = Math.max(...rows.slice(i + 1, i + 30).map(x => (x || []).length), 0);
    for (let c = 0; c < width; c++){
      if (dayCols[c] !== undefined) continue;
      const hits = rows.slice(i + 1).filter(x => x && /^\s*(week|wk)?\s*\d+\s*$/i.test(String(x[c] ?? ''))).length;
      if (hits > best){ best = hits; weekCol = c; }
    }
    return {row: i, dayCols, weekCol};
  }
  return null;
}
function cleanText(t){
  return String(t ?? '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\*\*|__/g, '').replace(/\\([!*_#\[\]().\-+|])/g, '$1').replace(/ /g, ' ').trim();
}
// Split a cell into readable steps. Paragraph breaks win; otherwise split sentences, including run-on
// ones joined by a space where a new sentence starts with a capitalized word ("recovery On uphill...").
function cellSteps(text){
  const paras = text.split(/\n+/).map(x => x.trim()).filter(Boolean);
  const out = [];
  for (const p of paras){
    p.replace(/([a-z0-9%)!?.])\s+(?=(Optional|On|If|It|It's|This|These|The|Today|Thursday|Really|Just|Keep|Aim|Think|Focus|Note|Now|Big|Adding|Drift|Check|You|Only|Slight|Aerobic|Heat|Rest|Easy|Uphill|No|Try|We|Lots|Plus)\b)/g, '$1\u0001')
     .split('\u0001').map(x => x.trim()).filter(Boolean).forEach(x => out.push(x));
  }
  return out;
}
function pickRange(lo, hi){ return hi === undefined || isNaN(hi) ? lo : UPF.range === 'low' ? lo : UPF.range === 'high' ? hi : (lo + hi) / 2; }
function inferSession(text, day){
  const t = text.toLowerCase();
  let sport = /^(rest|day off|off\b)|rest and recovery/.test(t) ? 'Rest'
    : /x-train|cross[- ]?train|elliptical/.test(t) ? 'Other'
    : /\b(bike|ride|cycl\w*|trainer|zwift|spin)\b/.test(t) ? 'Bike'
    : /\bswim\w*\b/.test(t) ? 'Swim'
    : /\b(lift\w*|strength|gym|weights)\b/.test(t) ? 'Strength'
    : /\b(miles?|mi|km|run\w*|jog\w*|treadmill|tm|strides|track)\b/.test(t) ? 'Run' : 'Other';
  let type = sport === 'Rest' ? 'Rest'
    : /1-hour effort|threshold|tempo|\blt2?\b|mod\/hard|lactate|cruise/.test(t) ? 'Tempo'
    : /\d+\s*x\s*\(?\s*\d|\bfast\b|vo2|interval|fartlek|sprint|\bhard\b/.test(t) ? 'Quality'
    : /\brecovery\b/.test(t) && sport === 'Run' ? 'Recovery' : 'Easy';
  const dm = /(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(miles?|mi|km|kilomet\w*)\b/.exec(t);
  let miles = 0;
  if (dm && sport !== 'Swim'){ const v = pickRange(+dm[1], dm[2] !== undefined ? +dm[2] : undefined); miles = /km|kilomet/.test(dm[3]) ? v / KM : v; }
  let mins = 0;
  const re = /(\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|min)\b/g; let mm;
  while ((mm = re.exec(t))){
    if (/x\s*$/.test(t.slice(Math.max(0, mm.index - 3), mm.index))) continue;     // "6 x 3 min" is a rep, not the session length
    const v = pickRange(+mm[1], mm[2] !== undefined ? +mm[2] : undefined);
    mins = /h/.test(mm[3]) ? v * 60 : v; break;
  }
  const head = text.split(/\s+with\s+|,|\(|\.\s/)[0].trim();
  const title = sport === 'Rest' ? 'Rest' : (head.length > 42 ? head.slice(0, 40).replace(/\s+\S*$/, '') + '…' : head) || `${type} ${sport.toLowerCase()}`;
  const intensity = ({Quality:'Hard', Tempo:'Hard'})[type] || (/\bmod\b|easy\/mod/.test(t) ? 'Moderate' : 'Easy');
  return {day, sport, type, intensity, title: title.charAt(0).toUpperCase() + title.slice(1), miles: Math.round(miles * 10) / 10, mins: Math.round(mins), swimDist: ''};
}
function parseGrid(rows, g, fileName){
  const problems = [], warnings = [], sessions = [];
  let fallbackWeek = 0, anyRange = false;
  for (let i = g.row + 1; i < rows.length; i++){
    const r = rows[i] || [], rn = i + 1;
    const cells = Object.keys(g.dayCols).map(c => [+c, cleanText(r[+c])]).filter(([, v]) => v);
    if (!cells.length) continue;                                   // spacer row
    const wl = g.weekCol >= 0 ? /(\d+)/.exec(String(r[g.weekCol] ?? '')) : null;
    const week = wl ? +wl[1] : ++fallbackWeek;
    if (!wl && g.weekCol >= 0) warnings.push(`Row ${rn}: no week number, so it was read as week ${week}.`);
    fallbackWeek = week;
    for (const [c, text] of cells){
      const day = g.dayCols[c];
      if (/\d+\s*(?:-|–|to)\s*\d+\s*(miles?|mi|km|min|hours?)/i.test(text)) anyRange = true;
      const steps = cellSteps(text);
      const opt = steps.filter(x => /^optional\s+(easy\s+)?(x-train|cross|bike|ride|run|uphill|swim|walk|hike|jog)/i.test(x));
      const main = steps.filter(x => !opt.includes(x));
      const s0 = inferSession(main[0] || text, day);
      sessions.push(Object.assign(s0, {row: rn, week, steps: main}));
      opt.forEach(o => {
        const so = inferSession(o.replace(/^optional\s+/i, ''), day);
        sessions.push(Object.assign(so, {row: rn, week, steps: [o], optional: true, intensity: 'Easy', type: so.sport === 'Rest' ? 'Rest' : 'Easy', title: 'Optional: ' + so.title.replace(/^./, ch => ch.toLowerCase())}));
      });
    }
  }
  if (!sessions.length) return {fatal: 'We found a weekly grid but no training in it.'};
  // The longest run of each week is the long run
  const weeksN = Math.max(...sessions.map(x => x.week));
  for (let w = 1; w <= weeksN; w++){
    const runs = sessions.filter(x => x.week === w && x.sport === 'Run' && !x.optional && x.miles).sort((a, b) => b.miles - a.miles);
    if (runs.length && (runs.length === 1 || runs[0].miles >= runs[1].miles * 1.25)){
      const L = runs[0];
      L.intensity = L.type === 'Tempo' ? 'Hard' : 'Moderate';     // a long run with a tempo inside is still the long run
      L.type = 'Long';
    }
  }
  const used = new Set(sessions.map(x => x.week)), empty = [];
  for (let w = 1; w <= weeksN; w++) if (!used.has(w)) empty.push(w);
  if (empty.length) warnings.push(`Week${empty.length > 1 ? 's' : ''} ${empty.join(', ')} ha${empty.length > 1 ? 've' : 's'} no sessions, so ${empty.length > 1 ? 'they' : 'it'} will show as rest.`);
  const plan = {fileName, weeks: weeksN, sessions, strength: {}, problems, warnings, grid: true, ranges: anyRange};
  plan.placement = placementWarnings(plan);
  return plan;
}
// Tables from Markdown (Google Docs "Download → Markdown") or a .docx (Word / Google Docs "Download → .docx")
function readMarkdownTables(text){
  const rows = [];
  for (const line of text.split(/\r?\n/)){
    if (!/^\s*\|/.test(line)){ if (rows.length && rows[rows.length - 1].length) rows.push([]); continue; }
    if (/^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/.test(line)) continue;      // separator row
    const cells = []; let cur = '', esc2 = false;
    for (const ch of line.trim().replace(/^\|/, '').replace(/\|$/, '')){
      if (esc2){ cur += ch === '|' ? '|' : '\\' + ch; esc2 = false; continue; }
      if (ch === '\\'){ esc2 = true; continue; }
      if (ch === '|'){ cells.push(cur.trim()); cur = ''; } else cur += ch;
    }
    cells.push(cur.trim()); rows.push(cells);
  }
  return rows;
}
async function readDOCX(buf){
  const z = await unzip(buf);
  const x = await z.text('word/document.xml'); if (!x) throw new Error('That .docx has no document inside it.');
  const doc = xmlDoc(x), W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const rows = [];
  for (const tbl of doc.getElementsByTagNameNS(W, 'tbl')){
    for (const tr of [...tbl.getElementsByTagNameNS(W, 'tr')].filter(n => n.parentNode === tbl)){
      rows.push([...tr.getElementsByTagNameNS(W, 'tc')].filter(n => n.parentNode === tr).map(tc =>
        [...tc.getElementsByTagNameNS(W, 'p')].map(p => [...p.getElementsByTagNameNS(W, 't')].map(t => t.textContent).join('')).join('\n').trim()));
    }
    rows.push([]);
  }
  if (!rows.length) throw new Error('That document has no tables in it.');
  return rows;
}

// ---------- multisport placement checks (spec: Spreadsheet upload template) ----------
function placementWarnings(plan){
  const out = [];
  const byDay = {};
  plan.sessions.forEach(x => { if (x.sport !== 'Rest' && !x.optional) (byDay[`${x.week}|${x.day}`] = byDay[`${x.week}|${x.day}`] || []).push(x); });
  const hardEnd = x => !['Strength','Other','Rest'].includes(x.sport) && x.intensity === 'Hard';
  const keyRun = x => x.sport === 'Run' && (x.type === 'Long' || x.type === 'Quality' || x.type === 'Tempo' || x.type === 'Race');
  for (let w = 1; w <= plan.weeks; w++){
    let endurance = 0, strength = 0, minutes = 0, restish = false;
    for (let d = 0; d < 7; d++){
      const list = byDay[`${w}|${d}`] || [];
      const name = `Week ${w} ${DAYS[d]}`;
      if (list.length > 2) out.push(`${name}: ${list.length} sessions in one day. Two is the usual maximum (a brick counts as one).`);
      if (list.filter(hardEnd).length >= 2) out.push(`${name}: two hard endurance sessions on the same day. Unless it's a brick, consider splitting them.`);
      const next = byDay[`${w}|${d + 1}`] || (d === 6 ? byDay[`${w + 1}|0`] || [] : []);
      if (list.some(x => x.sport === 'Strength') && next.some(keyRun)) out.push(`${name}: strength the day before a ${next.find(keyRun).type.toLowerCase()} run. If it's a heavy leg day, move it earlier.`);
      if (!list.length || list.every(x => x.intensity === 'Easy' && (x.sport === 'Swim' || x.sport === 'Other'))) restish = true;
      list.forEach(x => { if (x.sport === 'Strength') strength++; else if (x.sport !== 'Other') endurance++; minutes += x.mins || 0; });
    }
    if (!restish) out.push(`Week ${w}: no rest day or easy-swim day. A lighter day helps you absorb the work.`);
    if ((endurance >= 8 || minutes >= 600) && strength >= 3) out.push(`Week ${w}: a high-volume week with ${strength} strength sessions. Keeping strength to 1–2 short sessions usually works better.`);
  }
  return out;
}

function pasteRows(text){
  if (/^\s*\|/m.test(text)) return readMarkdownTables(text);
  return readCSV(text);
}
async function handleFile(file){
  if (!file) return;
  const seq = ++upSeq;                               // ignore results from an older file that finishes later
  UPF.file = file; UPF.busy = true; UPF.error = ''; drawUpload();
  let parsed = null, error = '';
  try {
    const name = file.name || 'plan';
    let sheets;
    if (file.pasted) sheets = {Pasted: pasteRows(file.text)};
    else if (/\.csv$/i.test(name) || file.type === 'text/csv') sheets = {Plan: readCSV(await file.text())};
    else if (/\.xlsx$/i.test(name)) sheets = await readXLSX(await file.arrayBuffer());
    else if (/\.docx$/i.test(name)) sheets = {Document: await readDOCX(await file.arrayBuffer())};
    else if (/\.(md|markdown|txt)$/i.test(name) || /^text\//.test(file.type)) sheets = {Document: pasteRows(await file.text())};
    else if (/\.(xls|numbers|pages|doc)$/i.test(name)) throw new Error('That format isn\'t supported. Save it as .xlsx, .csv, .docx or Markdown and try again.');
    else throw new Error('Upload an .xlsx, .csv, .docx or Markdown (.md) file.');
    parsed = parseUpload(sheets, name);
    if (parsed.fatal){ error = parsed.fatal; parsed = null; }
  } catch (err){ error = err.message || 'Something went wrong reading the file.'; parsed = null; }
  if (seq !== upSeq) return;
  UP = parsed; UPF.error = error; UPF.busy = false; drawUpload();
}
function importUpload(){
  if (!UP) return;
  if (!UPF.start){ $('err').textContent = 'Pick the date week 1 starts.'; return; }
  const d = parseDate(UPF.start); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // snap to that week's Monday
  A.mode = 'upload'; A.custom = UP; A.startDate = iso(d); A.units = UPF.units; A.timeline = 'length'; A.built = true;
  save(); uploadMode = false; $('next').disabled = false; showPlan();
}

// CUSTOM (UPLOADED) PLAN -> the same week/day shape the plan view uses
// =====================================================================
const ROLE_OF = {Quality:'Q', Tempo:'T', Long:'L', Easy:'E', Recovery:'R', Race:'RACE', Rest:'off'};
const SPORT_CLS = {Run:'run', Bike:'bike', Brick:'bike', Swim:'swim', Strength:'lift', Other:'other', Rest:''};
function sessionLabel(x){
  if (x.sport === 'Swim' && x.swimDist) return x.swimDist;
  return [x.miles ? fmtDist(x.miles) : '', x.mins ? `${x.mins} min` : ''].filter(Boolean).join(' · ');
}
function buildCustomPlan(){
  const C = A.custom, start = parseDate(A.startDate);
  const strengthLeft = {};
  Object.values(C.strength || {}).forEach(s => (strengthLeft[s.week] = strengthLeft[s.week] || []).push(s));
  const weeks = [];
  for (let w = 1; w <= C.weeks; w++){
    const days = [];
    for (let j = 0; j < 7; j++){
      const date = addDays(start, (w - 1) * 7 + j);
      const list = C.sessions.filter(x => x.week === w && x.day === j && x.sport !== 'Rest');
      const items = list.map(x => {
        let steps = x.steps;
        if (x.sport === 'Strength'){
          const pool = strengthLeft[w] || [];
          const k = pool.findIndex(s => normS(s.name) === normS(x.title) || normS(x.title).endsWith(' ' + normS(s.name)));
          const s = k >= 0 ? pool.splice(k, 1)[0] : null;
          if (s) steps = s.lines.concat(x.steps.filter(t => !/strength tab/i.test(t)));
        }
        return {cls: SPORT_CLS[x.sport] || 'other', sport: x.sport, title: x.title, sub: sessionLabel(x), hint: x.optional ? 'Optional' : x.sport === 'Strength' ? '' : `${x.type} · ${x.intensity}`, steps, x};
      });
      const main = list.find(x => !['Strength'].includes(x.sport) && !x.optional) || list.find(x => !['Strength'].includes(x.sport));
      const runMiles = list.filter(x => x.sport === 'Run' && !x.optional).reduce((t, x) => t + x.miles, 0);
      const load = list.filter(x => x.sport !== 'Strength' && !x.optional).reduce((t, x) => t + (x.mins ? x.mins / 9 : x.sport === 'Bike' ? x.miles / 3 : x.sport === 'Swim' ? 3 : x.miles), 0);
      days.push({date, role: main ? (main.sport === 'Run' ? ROLE_OF[main.type] || 'E' : 'X') : 'off', title: main ? main.title : (list.length ? list[0].title : 'Rest'),
        miles: runMiles, load, sport: main ? main.sport : '', lift: list.some(x => x.sport === 'Strength') ? 'Strength' : null, items, hint: HINT.off, steps: []});
    }
    // Strength from the Strength tab that wasn't placed in the plan tab: hard days first, never the day before a long run, 48 h apart
    const left = strengthLeft[w] || [];
    const order = [...days.keys()].sort((a, b) => ({Q:0, T:1, X:2, E:3, off:4, R:5}[days[a].role] ?? 9) - ({Q:0, T:1, X:2, E:3, off:4, R:5}[days[b].role] ?? 9));
    const usedIdx = days.map((d, i) => d.lift ? i : -1).filter(i => i >= 0);
    for (const s of left){
      const i = order.find(i => !['L','RACE'].includes(days[i].role) && !(days[i + 1] && ['L','Q','T','RACE'].includes(days[i + 1].role)) && !usedIdx.some(u => Math.abs(u - i) < 2) && days[i].items.length < 2);
      if (i === undefined) break;
      days[i].items.push({cls:'lift', sport:'Strength', title: s.name.length <= 2 ? 'Strength ' + s.name : s.name, sub:'', hint:'Placed for you, away from the day before your long run and hard runs.', steps: s.lines});
      days[i].lift = 'Strength'; usedIdx.push(i);
    }
    const total = days.reduce((t, d) => t + d.miles, 0);
    weeks.push({phase:'custom', days, total});
  }
  return {weeks, notes:{}, N: C.weeks, custom: true};
}
// Items to show for a day, for both generated and uploaded plans
function dayItems(d){
  if (d.items) return d.items;
  const out = [];
  const mins = d.miles && P && P.pace ? Math.round(d.miles * P.pace / 5) * 5 : 0;
  const sub = d.sub !== undefined ? d.sub : d.miles ? (isNew() && mins ? `about ${mins} min · ${fmtDist(d.miles)}` : fmtDist(d.miles)) : '';
  if (d.role !== 'off' || d.miles) out.push({cls:'run', sport:'Run', title: d.title, sub, hint: d.hint, steps: d.steps});
  else if (d.title === 'Optional walk') out.push({cls:'other', sport:'Other', title: d.title, sub, hint: d.hint, steps: d.steps, optional: true});
  if (d.lift) out.push({cls:'lift', sport:'Strength', title: d.lift, sub:'', hint: liftHint(d.lift), steps: d.liftSteps});
  return out;
}
